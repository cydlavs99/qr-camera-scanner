<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

/*
   IMPORTANT:

   Replace this URL with your deployed Google Apps Script
   Web App URL ending in /exec.

   Example:

   https://script.google.com/macros/s/XXXXXXXXXXXX/exec
*/

const API_URL =
  "PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";


/*
   CAMERA SETTINGS
*/

const CAMERA_CONFIG = {

  fps: 10,

  qrbox: {
    width: 280,
    height: 280
  },

  aspectRatio: 1.0

};


/*
   QR MUST REMAIN DETECTED FOR THIS LONG
   BEFORE IT IS ACCEPTED.
*/

const STABLE_REQUIRED_MS =
  1000;


/*
   AFTER A SUCCESSFUL TRANSACTION,
   THE SAME QR IS LOCKED UNTIL IT DISAPPEARS
   FROM THE CAMERA FOR THIS LONG.
*/

const QR_RELEASE_MS =
  800;


/*
   RESULT REMAINS VISIBLE FOR 7 SECONDS.
*/

const RESULT_DISPLAY_MS =
  7000;


/*
   JSONP REQUEST TIMEOUT
*/

const API_TIMEOUT_MS =
  20000;


/* =========================================================
   GLOBAL STATE
   ========================================================= */


/*
   MAIN CAMERA SCANNER
*/

let cameraScanner =
  null;


/*
   SEPARATE SCANNER FOR IMAGE UPLOAD.

   IMPORTANT:
   This is deliberately separate from cameraScanner.
*/

let uploadScanner =
  null;


/*
   CURRENT QR BEING HELD IN CAMERA
*/

let stableQR =
  "";


/*
   WHEN CURRENT QR WAS FIRST DETECTED
*/

let stableSince =
  0;


/*
   TRUE AFTER THE QR HAS BEEN ACCEPTED.

   While true, repeated callbacks from the
   same QR are ignored.
*/

let captureLocked =
  false;


/*
   Last accepted QR.

   Used to prevent duplicate transactions.
*/

let lockedQR =
  "";


/*
   Time when QR was last detected after lock.
*/

let lockedLastSeen =
  0;


/*
   Prevents simultaneous server requests.
*/

let requestInProgress =
  false;


/*
   Result timer.
*/

let resultTimer =
  null;


/*
   JSONP callback counter.
*/

let callbackCounter =
  0;


/* =========================================================
   DOM
   ========================================================= */

const readerElement =
  document.getElementById(
    "reader"
  );


const cameraStatus =
  document.getElementById(
    "cameraStatus"
  );


const uploadInput =
  document.getElementById(
    "qrImageInput"
  );


const uploadStatus =
  document.getElementById(
    "uploadStatus"
  );


const loading =
  document.getElementById(
    "loading"
  );


const resultCard =
  document.getElementById(
    "resultCard"
  );


const statusBadge =
  document.getElementById(
    "statusBadge"
  );


const details =
  document.getElementById(
    "details"
  );


/* =========================================================
   PAGE START
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function () {

    startCamera();

  }
);


/* =========================================================
   CAMERA
   ========================================================= */

async function startCamera() {

  setCameraStatus(
    "Starting camera...",
    ""
  );


  if (
    !API_URL ||
    API_URL.indexOf(
      "PASTE_YOUR_"
    ) === 0
  ) {

    setCameraStatus(
      "Camera can start, but API_URL still needs to be configured.",
      "warning"
    );

  }


  try {

    /*
       Get available cameras.

       We prefer the back/environment camera.
    */

    const cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      !cameras.length
    ) {

      throw new Error(
        "No camera was found on this device."
      );

    }


    let selectedCamera =
      cameras[0];


    /*
       Prefer camera whose label indicates
       rear/back/environment camera.
    */

    const preferred =
      cameras.find(
        function (camera) {

          const label =
            String(
              camera.label || ""
            ).toLowerCase();


          return (
            label.includes(
              "back"
            ) ||
            label.includes(
              "rear"
            ) ||
            label.includes(
              "environment"
            )
          );

        }
      );


    if (preferred) {

      selectedCamera =
        preferred;

    }


    /*
       Create the continuous camera scanner.
    */

    cameraScanner =
      new Html5Qrcode(
        "reader"
      );


    await cameraScanner.start(

      selectedCamera.id,

      CAMERA_CONFIG,

      handleCameraDetection,

      handleCameraDecodeError

    );


    setCameraStatus(
      "Camera ready. Hold the QR inside the box for about 1 second.",
      "success"
    );


  } catch (error) {

    console.error(
      "Camera start error:",
      error
    );


    setCameraStatus(
      "Camera could not start: " +
      getErrorText(error),
      "error"
    );

  }

}


/* =========================================================
   CAMERA QR DETECTION
   ========================================================= */

function handleCameraDetection(
  decodedText
) {

  const qr =
    String(
      decodedText || ""
    ).trim();


  if (!qr) {

    return;

  }


  /*
     If a request is already being processed,
     do not create another transaction.
  */

  if (requestInProgress) {

    return;

  }


  /*
     AFTER SUCCESSFUL CAPTURE

     The QR remains locked while it is still
     visible in the camera.

     This prevents:

       IN
       OUT
       IN
       OUT

     from happening from one stationary QR.
  */

  if (captureLocked) {

    if (
      qr === lockedQR
    ) {

      lockedLastSeen =
        Date.now();

      return;

    }


    /*
       A different QR was detected while
       the previous QR is still considered locked.

       Do not immediately process it.
       We wait for the previous QR to be released.
    */

    return;

  }


  /*
     SAME QR CONTINUES TO BE SEEN
  */

  if (
    stableQR === qr
  ) {

    const elapsed =
      Date.now() -
      stableSince;


    /*
       QR has remained stable for approximately
       1 second.
    */

    if (
      elapsed >=
      STABLE_REQUIRED_MS
    ) {

      acceptCameraQR(
        qr
      );

    }


    return;

  }


  /*
     NEW QR DETECTED

     Start the 1-second stability timer.
  */

  stableQR =
    qr;

  stableSince =
    Date.now();


  setCameraStatus(
    "QR detected. Hold steady...",
    "warning"
  );

}


/* =========================================================
   CAMERA DECODE FAILURE
   ========================================================= */

function handleCameraDecodeError(
  errorMessage
) {

  /*
     html5-qrcode calls this very frequently
     while no QR is visible.

     We deliberately do not display every
     decode error.
  */

  if (
    captureLocked &&
    lockedLastSeen > 0
  ) {

    /*
       No successful detection has refreshed
       lockedLastSeen.

       If enough time has passed, release
       the previous QR lock.
    */

    if (
      Date.now() -
      lockedLastSeen >=
      QR_RELEASE_MS
    ) {

      releaseCameraLock();

    }

  }


  /*
     If we are not locked, clear the stability
     timer after the QR is no longer detected.
  */

  if (
    !captureLocked &&
    stableQR
  ) {

    /*
       html5-qrcode doesn't give us a perfect
       "QR disappeared" event.

       We allow the next successful detection
       to replace the current candidate.
    */

  }

}


/* =========================================================
   ACCEPT CAMERA QR
   ========================================================= */

function acceptCameraQR(
  qr
) {

  if (
    captureLocked ||
    requestInProgress
  ) {

    return;

  }


  /*
     LOCK IMMEDIATELY.

     This is the important part.

     Once the QR has been stable for 1 second,
     the decoded value is stored in memory.
     The camera may continue running,
     but repeated reads cannot create
     duplicate transactions.
  */

  captureLocked =
    true;

  lockedQR =
    qr;

  lockedLastSeen =
    Date.now();


  stableQR =
    "";

  stableSince =
    0;


  setCameraStatus(
    "QR captured. Processing transaction...",
    "success"
  );


  /*
     Send the already captured QR to server.

     Moving the camera away now does NOT affect
     this transaction.
  */

  sendScanToServer(
    qr,
    "camera"
  );

}


/* =========================================================
   RELEASE CAMERA LOCK
   ========================================================= */

function releaseCameraLock() {

  captureLocked =
    false;

  lockedQR =
    "";

  lockedLastSeen =
    0;

  stableQR =
    "";

  stableSince =
    0;


  setCameraStatus(
    "Camera ready. Scan the next QR.",
    "success"
  );

}


/* =========================================================
   IMAGE UPLOAD
   ========================================================= */

uploadInput.addEventListener(
  "change",
  async function (event) {

    const file =
      event.target.files &&
      event.target.files[0];


    /*
       Reset input value after processing
       so selecting the same file again
       will still fire change.
    */

    event.target.value =
      "";


    if (!file) {

      return;

    }


    if (
      requestInProgress
    ) {

      uploadStatus.textContent =
        "Please wait for the current transaction to finish.";

      return;

    }


    uploadStatus.textContent =
      "Reading QR image...";


    setLoading(
      true
    );


    try {

      /*
         IMPORTANT:

         Separate Html5Qrcode instance
         from the continuous camera scanner.
      */

      if (!uploadScanner) {

        const uploadReader =
          document.createElement(
            "div"
          );

        uploadReader.id =
          "uploadQrHiddenReader";

        uploadReader.style.display =
          "none";

        document.body.appendChild(
          uploadReader
        );


        uploadScanner =
          new Html5Qrcode(
            "uploadQrHiddenReader"
          );

      }


      /*
         scanFile is local.

         The image is not uploaded to a third-party
         server by html5-qrcode.
      */

      const decodedText =
        await uploadScanner.scanFile(
          file,
          false
        );


      const qr =
        String(
          decodedText || ""
        ).trim();


      if (!qr) {

        throw new Error(
          "No QR code was found in the selected image."
        );

      }


      uploadStatus.textContent =
        "QR detected. Processing transaction...";


      /*
         SAME SERVER-SIDE ATTENDANCE STATE
         AS CAMERA.
      */

      sendScanToServer(
        qr,
        "upload"
      );


    } catch (error) {

      console.error(
        "Upload QR error:",
        error
      );


      uploadStatus.textContent =
        "QR image could not be read: " +
        getErrorText(error);


      setLoading(
        false
      );

    }

  }
);


/* =========================================================
   SEND SCAN TO GOOGLE APPS SCRIPT
   ========================================================= */

function sendScanToServer(
  qr,
  source
) {

  if (
    requestInProgress
  ) {

    return;

  }


  if (
    !API_URL ||
    API_URL.indexOf(
      "PASTE_YOUR_"
    ) === 0
  ) {

    showErrorResult(
      "API URL is not configured. Replace API_URL with your Google Apps Script Web App /exec URL."
    );


    requestInProgress =
      false;


    setLoading(
      false
    );


    return;

  }


  requestInProgress =
    true;


  setLoading(
    true
  );


  /*
     JSONP avoids depending on CORS
     from GitHub Pages to Apps Script.
  */

  const callbackName =
    "__cgfleetCallback_" +
    Date.now() +
    "_" +
    (
      ++callbackCounter
    );


  const script =
    document.createElement(
      "script"
    );


  let completed =
    false;


  const timeout =
    setTimeout(
      function () {

        if (
          completed
        ) {

          return;

        }


        completed =
          true;


        cleanupJsonp(
          script,
          callbackName
        );


        requestInProgress =
          false;


        setLoading(
          false
        );


        showErrorResult(
          "The server did not respond in time. Please try again."
        );


        /*
           For camera:

           We keep the QR locked so that the same
           QR cannot immediately create another
           transaction.

           User simply moves QR away.
        */

        if (
          source === "camera"
        ) {

          setCameraStatus(
            "Server timeout. Move the QR away, then scan again.",
            "error"
          );

        }

      },
      API_TIMEOUT_MS
    );


  window[callbackName] =
    function (response) {

      if (
        completed
      ) {

        return;

      }


      completed =
        true;


      clearTimeout(
        timeout
      );


      cleanupJsonp(
        script,
        callbackName
      );


      requestInProgress =
        false;


      setLoading(
        false
      );


      handleServerResponse(
        response,
        source
      );

    };


  script.onerror =
    function () {

      if (
        completed
      ) {

        return;

      }


      completed =
        true;


      clearTimeout(
        timeout
      );


      cleanupJsonp(
        script,
        callbackName
      );


      requestInProgress =
        false;


      setLoading(
        false
      );


      showErrorResult(
        "Unable to connect to the Google Apps Script Web App."
      );


      if (
        source === "camera"
      ) {

        setCameraStatus(
          "Connection error. Move the QR away before trying again.",
          "error"
        );

      }

    };


  /*
     URL parameters.

     encodeURIComponent is important for plates,
     JSON QR values, etc.
  */

  const url =
    API_URL +
    (
      API_URL.includes(
        "?"
      )
        ? "&"
        : "?"
    ) +
    "action=scan" +
    "&qr=" +
    encodeURIComponent(
      qr
    ) +
    "&source=" +
    encodeURIComponent(
      source
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&_=" +
    Date.now();


  script.src =
    url;


  document.body.appendChild(
    script
  );

}


/* =========================================================
   JSONP CLEANUP
   ========================================================= */

function cleanupJsonp(
  script,
  callbackName
) {

  try {

    if (
      script &&
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }

  } catch (error) {}


  try {

    delete window[
      callbackName
    ];

  } catch (error) {

    window[
      callbackName
    ] =
      undefined;

  }

}


/* =========================================================
   SERVER RESPONSE
   ========================================================= */

function handleServerResponse(
  response,
  source
) {

  if (
    !response
  ) {

    showErrorResult(
      "Empty response received from server."
    );


    return;

  }


  /*
     SUCCESSFUL TRANSACTION
  */

  if (
    response.success
  ) {

    showResult(
      response
    );


    if (
      source === "camera"
    ) {

      setCameraStatus(
        (
          response.status === "IN"
            ? "TIME IN recorded successfully."
            : "TIME OUT recorded successfully."
        ) +
        " Move the QR away to scan again.",
        "success"
      );

    }


    if (
      source === "upload"
    ) {

      uploadStatus.textContent =
        (
          response.status === "IN"
            ? "TIME IN recorded successfully."
            : "TIME OUT recorded successfully."
        );

    }


    return;

  }


  /*
     SERVER REJECTED QR
  */

  const message =
    response.message ||
    "QR code was not accepted.";


  showErrorResult(
    message,
    response
  );


  if (
    source === "camera"
  ) {

    setCameraStatus(
      message +
      " Move the QR away before trying again.",
      "error"
    );

  }


  if (
    source === "upload"
  ) {

    uploadStatus.textContent =
      message;

  }

}


/* =========================================================
   DISPLAY RESULT
   ========================================================= */

function showResult(
  data
) {

  clearTimeout(
    resultTimer
  );


  const status =
    String(
      data.status || ""
    ).toUpperCase();


  const isIn =
    status === "IN";


  statusBadge.textContent =
    isIn
      ? "TIME IN"
      : "TIME OUT";


  statusBadge.className =
    "status-badge " +
    (
      isIn
        ? "status-in"
        : "status-out"
    );


  details.innerHTML =

    detailHTML(
      "Office / Agency",
      data.office
    ) +

    detailHTML(
      "Serial Number",
      data.serialNumber
    ) +

    detailHTML(
      "Rank / Position",
      data.rank
    ) +

    detailHTML(
      "First Name",
      data.firstName
    ) +

    detailHTML(
      "M.I",
      data.mi
    ) +

    detailHTML(
      "Last Name",
      data.lastName
    ) +

    detailHTML(
      "Contact Number",
      data.contact
    ) +

    detailHTML(
      "Vehicle / Model",
      data.vehicle
    ) +

    detailHTML(
      "Vehicle Color",
      data.vehicleColor
    ) +

    detailHTML(
      "Plate Number",
      data.plate
    ) +

    detailHTML(
      "Purpose of Visit",
      data.purpose,
      true
    ) +

    detailHTML(
      "Date / Time",
      data.dateTime
    ) +

    detailHTML(
      "Time In",
      data.timeIn
    ) +

    detailHTML(
      "Time Out",
      data.timeOut
    ) +

    detailSourceHTML(
      data.source
    );


  resultCard.classList.add(
    "visible"
  );


  /*
     RESULT STAYS VISIBLE FOR 7 SECONDS.
  */

  resultTimer =
    setTimeout(
      function () {

        resultCard.classList.remove(
          "visible"
        );


        details.innerHTML =
          "";

      },
      RESULT_DISPLAY_MS
    );

}


/* =========================================================
   ERROR RESULT
   ========================================================= */

function showErrorResult(
  message,
  data
) {

  clearTimeout(
    resultTimer
  );


  statusBadge.textContent =
    "ERROR";


  statusBadge.className =
    "status-badge status-out";


  let html =
    detailHTML(
      "Message",
      message,
      true
    );


  if (
    data
  ) {

    html +=
      detailHTML(
        "Plate Number",
        data.plate
      );


    html +=
      detailSourceHTML(
        data.source
      );

  }


  details.innerHTML =
    html;


  resultCard.classList.add(
    "visible"
  );


  resultTimer =
    setTimeout(
      function () {

        resultCard.classList.remove(
          "visible"
        );


        details.innerHTML =
          "";

      },
      RESULT_DISPLAY_MS
    );

}


/* =========================================================
   DETAIL HTML
   ========================================================= */

function detailHTML(
  label,
  value,
  full
) {

  const safeLabel =
    escapeHTML(
      label
    );


  const safeValue =
    escapeHTML(
      value
    );


  return (
    '<div class="detail' +
    (
      full
        ? ' full'
        : ''
    ) +
    '">' +

      '<span class="detail-label">' +
        safeLabel +
      '</span>' +

      '<div class="detail-value">' +
        (
          safeValue ||
          "—"
        ) +
      '</div>' +

    '</div>'
  );

}


/* =========================================================
   SOURCE DETAIL
   ========================================================= */

function detailSourceHTML(
  source
) {

  return (
    '<div class="detail full">' +

      '<span class="detail-label">' +
        'Scan Source' +
      '</span>' +

      '<div class="detail-value">' +

        '<span class="source-badge">' +
          escapeHTML(
            source ||
            "UNKNOWN"
          ) +
        '</span>' +

      '</div>' +

    '</div>'
  );

}


/* =========================================================
   LOADING
   ========================================================= */

function setLoading(
  visible
) {

  if (
    visible
  ) {

    loading.classList.add(
      "visible"
    );

  } else {

    loading.classList.remove(
      "visible"
    );

  }

}


/* =========================================================
   CAMERA STATUS
   ========================================================= */

function setCameraStatus(
  message,
  type
) {

  cameraStatus.textContent =
    message;


  cameraStatus.className =
    "camera-status";


  if (
    type
  ) {

    cameraStatus.classList.add(
      type
    );

  }

}


/* =========================================================
   ERROR TEXT
   ========================================================= */

function getErrorText(
  error
) {

  if (
    error &&
    error.message
  ) {

    return error.message;

  }


  return String(
    error ||
    "Unknown error"
  );

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(
  value
) {

  return String(
    value == null
      ? ""
      : value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   PAGE VISIBILITY
   ========================================================= */

document.addEventListener(
  "visibilitychange",
  function () {

    /*
       We intentionally DO NOT reset the server state.

       Attendance state is stored in Google Sheets,
       not in this browser.
    */

    if (
      document.visibilityState ===
      "visible"
    ) {

      if (
        !cameraScanner
      ) {

        startCamera();

      }

    }

  }
);


/* =========================================================
   BEFORE PAGE CLOSE
   ========================================================= */

window.addEventListener(
  "beforeunload",
  function () {

    /*
       Do not attempt to change attendance state here.

       TIME IN / TIME OUT is recorded only by the
       successful server transaction.
    */

  }
);

</script>

</body>
