<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b5cff"
  >

  <title>CGFLEET QR Scanner</title>

  <script
    src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"
  ></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6fa;
      color: #111827;
    }

    .wrap {
      width: min(960px, 100%);
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 5px 24px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(24px, 5vw, 36px);
    }

    .sub {
      margin: 0;
      color: #64748b;
    }

    .videoBox {
      position: relative;
      width: 100%;
      max-width: 720px;
      margin: 18px auto;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .frame {
      position: absolute;
      inset: 16% 15%;
      border: 3px solid #00ff44;
      border-radius: 18px;
      pointer-events: none;
      box-shadow:
        0 0 0 9999px rgba(0,0,0,.14);
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      max-width: 720px;
      margin: 0 auto;
    }

    button,
    .upload {
      min-height: 52px;
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button {
      background: #0b5cff;
      color: #fff;
    }

    button.stop {
      background: #dc2626;
    }

    .upload {
      background: #e8eef8;
      color: #123456;
    }

    input[type=file] {
      display: none;
    }

    .status {
      max-width: 720px;
      margin: 12px auto 0;
      padding: 12px;
      border-radius: 10px;
      background: #eef2f7;
      color: #334155;
      text-align: center;
      font-weight: 700;
    }

    .result {
      display: none;
      max-width: 720px;
      margin: 18px auto 0;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }

    .head {
      padding: 14px 18px;
      font-size: 22px;
      font-weight: 800;
    }

    .in .head {
      background: #00ff00;
      color: #000;
    }

    .out .head {
      background: #ff0000;
      color: #fff;
    }

    .error .head {
      background: #111827;
      color: #fff;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #fff;
    }

    .item {
      padding: 13px 16px;
      border-top: 1px solid #e5e7eb;
    }

    .label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .value {
      font-size: 16px;
      font-weight: 700;
      word-break: break-word;
    }

    .hint {
      max-width: 720px;
      margin: 14px auto 0;
      text-align: center;
      color: #64748b;
      line-height: 1.45;
    }

    canvas {
      display: none;
    }

    @media(max-width:600px) {
      .wrap {
        padding: 10px;
      }

      .card {
        padding: 14px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .frame {
        inset: 14% 10%;
      }
    }
  </style>

</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>CGFLEET QR Scanner</h1>

    <p class="sub">
      Camera Scan + QR Image Upload
    </p>

    <div class="videoBox">

      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

      <div class="frame"></div>

    </div>

    <canvas id="canvas"></canvas>

    <div class="buttons">

      <button
        type="button"
        onclick="startCamera()"
      >
        START CAMERA
      </button>

      <button
        type="button"
        class="stop"
        onclick="stopCamera()"
      >
        STOP CAMERA
      </button>

      <label
        class="upload"
        for="fileInput"
      >
        UPLOAD QR / SCREENSHOT
      </label>

      <input
        id="fileInput"
        type="file"
        accept="image/png,image/jpeg,image/webp"
      >

    </div>

    <div
      id="status"
      class="status"
    >
      Ready. Start camera or upload a QR image.
    </div>

    <p class="hint">
      Camera access requires an HTTPS GitHub Pages address.
      Allow camera permission on the device.
    </p>

    <div
      id="result"
      class="result"
    >

      <div
        id="head"
        class="head"
      ></div>

      <div
        id="details"
        class="details"
      ></div>

    </div>

  </div>

</div>


<script>

  /*
   * ========================================================
   * PASTE YOUR GOOGLE APPS SCRIPT WEB APP /exec URL HERE
   *
   * Example:
   * https://script.google.com/macros/s/XXXXXXXX/exec
   * ========================================================
   */
  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbz48aoiboeku_9hfIliKeBUNLSyyytkIoSZIZaqiQCMQ_--4Nq0xI3GAxozN65AB-rnrw/exec";


  let stream = null;
  let scanning = false;
  let busy = false;

  let lastDecoded = "";
  let lastDecodedAt = 0;

  const video =
    document.getElementById(
      "video"
    );

  const canvas =
    document.getElementById(
      "canvas"
    );

  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );

  const fileInput =
    document.getElementById(
      "fileInput"
    );

  const status =
    document.getElementById(
      "status"
    );

  const result =
    document.getElementById(
      "result"
    );

  const head =
    document.getElementById(
      "head"
    );

  const details =
    document.getElementById(
      "details"
    );


  /*
   * ========================================================
   * CAMERA
   * ========================================================
   */

  async function startCamera() {

    clearResult();

    if (!window.isSecureContext) {

      showError(
        "HTTPS REQUIRED",
        "Open this page using the HTTPS GitHub Pages address."
      );

      return;
    }

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      showError(
        "CAMERA NOT SUPPORTED",
        "Your current browser does not support camera access."
      );

      return;
    }

    stopCamera();

    setStatus(
      "Opening camera..."
    );

    try {

      /*
       * Prefer rear camera.
       */
      stream =
        await navigator.mediaDevices
          .getUserMedia({

            video: {
              facingMode: {
                ideal: "environment"
              },

              width: {
                ideal: 1280
              },

              height: {
                ideal: 720
              }
            },

            audio: false
          });

    } catch (firstError) {

      console.error(
        firstError
      );

      /*
       * Desktop/fallback camera.
       */
      try {

        stream =
          await navigator.mediaDevices
            .getUserMedia({

              video: true,

              audio: false
            });

      } catch (secondError) {

        console.error(
          secondError
        );

        showError(
          "CAMERA ERROR",
          "Hindi mabuksan ang camera. Check HTTPS at browser camera permission."
        );

        return;
      }
    }

    video.srcObject =
      stream;

    try {
      await video.play();
    } catch (e) {
      console.error(e);
    }

    scanning =
      true;

    setStatus(
      "Camera active. Point the QR inside the green frame."
    );

    requestAnimationFrame(
      scanCameraFrame
    );
  }


  function stopCamera() {

    scanning =
      false;

    if (stream) {

      stream
        .getTracks()
        .forEach(
          function(track) {
            track.stop();
          }
        );

      stream =
        null;
    }

    video.srcObject =
      null;

    setStatus(
      "Camera stopped."
    );
  }


  function scanCameraFrame() {

    if (!scanning) {
      return;
    }

    if (
      video.readyState >= 2 &&
      video.videoWidth > 0 &&
      !busy
    ) {

      const maxWidth =
        1000;

      const scale =
        Math.min(
          1,
          maxWidth /
            video.videoWidth
        );

      canvas.width =
        Math.floor(
          video.videoWidth *
          scale
        );

      canvas.height =
        Math.floor(
          video.videoHeight *
          scale
        );

      ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const imageData =
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );

      const code =
        jsQR(
          imageData.data,
          imageData.width,
          imageData.height,
          {
            inversionAttempts:
              "attemptBoth"
          }
        );

      if (
        code &&
        code.data
      ) {

        handleDecodedQR(
          code.data
        );

        return;
      }
    }

    requestAnimationFrame(
      scanCameraFrame
    );
  }


  /*
   * ========================================================
   * UPLOAD
   * ========================================================
   */

  fileInput.addEventListener(
    "change",
    async function() {

      const file =
        this.files &&
        this.files[0];

      if (!file) {
        return;
      }

      clearResult();

      if (
        !file.type.startsWith(
          "image/"
        )
      ) {

        showError(
          "INVALID FILE",
          "Use PNG, JPG/JPEG, WebP, or a screenshot."
        );

        this.value =
          "";

        return;
      }

      try {

        setStatus(
          "Reading uploaded QR image..."
        );

        const img =
          await loadImage(
            file
          );

        const code =
          decodeImage(
            img
          );

        if (
          !code ||
          !code.data
        ) {

          showError(
            "QR NOT FOUND",
            "Hindi mabasa ang QR. Gumamit ng malinaw na screenshot o larawan."
          );

          return;
        }

        handleDecodedQR(
          code.data
        );

      } catch (error) {

        console.error(
          error
        );

        showError(
          "IMAGE ERROR",
          "Hindi mabuksan o mabasa ang image."
        );

      } finally {

        this.value =
          "";
      }
    }
  );


  function loadImage(file) {

    return new Promise(
      function(resolve, reject) {

        const url =
          URL.createObjectURL(
            file
          );

        const img =
          new Image();

        img.onload =
          function() {

            URL.revokeObjectURL(
              url
            );

            resolve(img);
          };

        img.onerror =
          function() {

            URL.revokeObjectURL(
              url
            );

            reject(
              new Error(
                "Unable to load image."
              )
            );
          };

        img.src =
          url;
      }
    );
  }


  function decodeImage(img) {

    const sizes = [
      1600,
      1200,
      900,
      700
    ];

    for (
      let i = 0;
      i < sizes.length;
      i++
    ) {

      const maxWidth =
        sizes[i];

      const scale =
        Math.min(
          1,
          maxWidth /
            img.naturalWidth
        );

      const width =
        Math.max(
          1,
          Math.floor(
            img.naturalWidth *
            scale
          )
        );

      const height =
        Math.max(
          1,
          Math.floor(
            img.naturalHeight *
            scale
          )
        );

      canvas.width =
        width;

      canvas.height =
        height;

      ctx.clearRect(
        0,
        0,
        width,
        height
      );

      ctx.drawImage(
        img,
        0,
        0,
        width,
        height
      );

      const imageData =
        ctx.getImageData(
          0,
          0,
          width,
          height
        );

      const code =
        jsQR(
          imageData.data,
          imageData.width,
          imageData.height,
          {
            inversionAttempts:
              "attemptBoth"
          }
        );

      if (
        code &&
        code.data
      ) {
        return code;
      }
    }

    return null;
  }


  /*
   * ========================================================
   * QR VALUE
   * ========================================================
   */

  function handleDecodedQR(
    raw
  ) {

    if (busy) {
      return;
    }

    const serial =
      normalizeSerial(
        raw
      );

    if (
      !isValidSerial(
        serial
      )
    ) {

      showError(
        "INVALID QR CODE",
        "The QR must contain only a valid Serial Number such as O-12345 or 023449."
      );

      return;
    }

    const now =
      Date.now();

    /*
     * Camera frames often decode the same QR repeatedly.
     */
    if (
      serial ===
        lastDecoded &&
      now -
        lastDecodedAt <
        2500
    ) {
      return;
    }

    lastDecoded =
      serial;

    lastDecodedAt =
      now;

    sendScan(
      serial
    );
  }


  function normalizeSerial(
    value
  ) {

    return String(
      value || ""
    )
      .replace(
        /\u00A0/g,
        " "
      )
      .trim()
      .toUpperCase();
  }


  function isValidSerial(
    serial
  ) {

    if (!serial) {
      return false;
    }

    return /^[A-Z0-9][A-Z0-9 _-]{1,39}$/
      .test(
        serial
      );
  }


  /*
   * ========================================================
   * GOOGLE APPS SCRIPT JSONP
   * ========================================================
   */

  function sendScan(
    serial
  ) {

    if (
      !APPS_SCRIPT_URL ||
      APPS_SCRIPT_URL.includes(
        "PASTE_YOUR"
      )
    ) {

      showError(
        "APPS SCRIPT URL NOT SET",
        "Paste the deployed Apps Script /exec URL into index.html first."
      );

      return;
    }

    busy =
      true;

    setStatus(
      "Processing " +
      serial +
      "..."
    );

    const callbackName =
      "cgfleetCallback_" +
      Date.now() +
      "_" +
      Math.floor(
        Math.random() *
        100000
      );

    const script =
      document.createElement(
        "script"
      );

    let finished =
      false;

    function cleanup() {

      try {
        script.remove();
      } catch (e) {}

      try {
        delete window[
          callbackName
        ];
      } catch (e) {}
    }

    function finish() {

      if (finished) {
        return false;
      }

      finished =
        true;

      cleanup();

      busy =
        false;

      return true;
    }

    const timeout =
      setTimeout(
        function() {

          if (!finish()) {
            return;
          }

          showError(
            "CONNECTION ERROR",
            "Walang response mula sa Google Apps Script. Check ang /exec URL at deployment."
          );

          resumeCamera();

        },
        15000
      );


    window[
      callbackName
    ] =
      function(data) {

        clearTimeout(
          timeout
        );

        if (!finish()) {
          return;
        }

        if (
          !data ||
          data.success !== true
        ) {

          showError(
            data && data.error
              ? data.error
              : "SCAN ERROR",

            data && data.message
              ? data.message
              : "Hindi ma-process ang QR code."
          );

          resumeCamera();

          return;
        }

        showSuccess(
          data
        );

        resumeCamera(
          1000
        );
      };


    script.onerror =
      function() {

        clearTimeout(
          timeout
        );

        if (!finish()) {
          return;
        }

        showError(
          "CONNECTION ERROR",
          "Hindi ma-access ang Google Apps Script Web App."
        );

        resumeCamera();
      };


    const separator =
      APPS_SCRIPT_URL.includes(
        "?"
      )
        ? "&"
        : "?";


    script.src =
      APPS_SCRIPT_URL +
      separator +
      "action=scan" +
      "&serial=" +
      encodeURIComponent(
        serial
      ) +
      "&callback=" +
      encodeURIComponent(
        callbackName
      );


    document.body.appendChild(
      script
    );
  }


  function resumeCamera(
    delay = 0
  ) {

    if (!scanning) {
      return;
    }

    setTimeout(
      function() {

        if (scanning) {

          requestAnimationFrame(
            scanCameraFrame
          );
        }
      },
      delay
    );
  }


  /*
   * ========================================================
   * RESULT UI
   * ========================================================
   */

  function showSuccess(
    data
  ) {

    const isIn =
      data.action ===
      "TIME IN";

    result.className =
      "result " +
      (
        isIn
          ? "in"
          : "out"
      );

    head.textContent =
      isIn
        ? "TIME IN — GREEN"
        : "TIME OUT — RED";

    details.innerHTML =
      item(
        "Serial Number",
        data.serial
      ) +
      item(
        "Rank / Full Name",
        data.name
      ) +
      item(
        "Office / Unit",
        data.office
      ) +
      item(
        "Contact Number",
        data.contact
      ) +
      item(
        "Vehicle / Model",
        data.vehicle
      ) +
      item(
        "Color of Vehicle",
        data.color
      ) +
      item(
        "Car Plate Number",
        data.plate
      ) +
      item(
        "Date / Time",
        data.dateTime
      ) +
      item(
        "Current Status",
        data.status
      );

    result.style.display =
      "block";

    setStatus(
      data.action +
      " recorded successfully."
    );
  }


  function showError(
    title,
    message
  ) {

    result.className =
      "result error";

    head.textContent =
      title;

    details.innerHTML =
      item(
        "Message",
        message
      );

    result.style.display =
      "block";

    setStatus(
      title
    );
  }


  function clearResult() {

    result.style.display =
      "none";
  }


  function setStatus(
    message
  ) {

    status.textContent =
      message;
  }


  function item(
    label,
    value
  ) {

    return (
      '<div class="item">' +
        '<div class="label">' +
          escapeHtml(
            label
          ) +
        '</div>' +
        '<div class="value">' +
          escapeHtml(
            value || "-"
          ) +
        '</div>' +
      '</div>'
    );
  }


  function escapeHtml(
    value
  ) {

    return String(
      value == null
        ? ""
        : value
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }

</script>

</body>
</html>
