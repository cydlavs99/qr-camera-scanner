<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta
    name="theme-color"
    content="#198754">

  <title>QR Time In / Time Out</title>

  <!-- QR DECODER -->
  <script
    src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;
      min-height: 100%;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f4f6f8;

    }


    body {

      padding: 15px;

    }


    .container {

      width: 100%;
      max-width: 560px;
      margin: 0 auto;

      background: #ffffff;

      border-radius: 18px;

      padding: 20px;

      box-shadow:
        0 4px 20px
        rgba(0, 0, 0, 0.12);

    }


    h1 {

      text-align: center;

      font-size: 24px;

      margin:
        0 0 6px;

    }


    .subtitle {

      text-align: center;

      color: #666666;

      margin-bottom: 18px;

      font-size: 14px;

    }


    /* =========================
       CAMERA
    ========================= */

    .camera-box {

      position: relative;

      width: 100%;

      aspect-ratio: 1 / 1;

      background: #111111;

      border-radius: 15px;

      overflow: hidden;

    }


    #video {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

      background: #111111;

    }


    #canvas {

      display: none;

    }


    .scan-frame {

      position: absolute;

      width: 68%;

      height: 68%;

      left: 16%;

      top: 16%;

      border:
        3px solid
        #00ff66;

      border-radius: 16px;

      pointer-events: none;

      box-shadow:
        0 0 10px
        rgba(0, 255, 102, .35);

    }


    .scan-line {

      position: absolute;

      left: 10%;

      width: 80%;

      height: 2px;

      background: #00ff66;

      animation:
        scanLine 2s
        linear infinite;

      pointer-events: none;

      box-shadow:
        0 0 8px
        #00ff66;

    }


    @keyframes scanLine {

      0% {
        top: 10%;
      }

      50% {
        top: 90%;
      }

      100% {
        top: 10%;
      }

    }


    /* =========================
       CAMERA STATUS
    ========================= */

    .camera-status {

      margin-top: 10px;

      padding: 10px;

      text-align: center;

      border-radius: 9px;

      background: #e9ecef;

      color: #212529;

      font-weight: bold;

      font-size: 14px;

    }


    /* =========================
       BUTTONS
    ========================= */

    .buttons {

      display: flex;

      gap: 10px;

      margin-top: 12px;

    }


    button,
    label {

      width: 100%;

      border: none;

      border-radius: 9px;

      padding:
        14px 10px;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;

      text-align: center;

      -webkit-tap-highlight-color:
        transparent;

      user-select: none;

    }


    button:disabled {

      opacity: .55;

      cursor: not-allowed;

    }


    #startCamera {

      background: #198754;

      color: white;

    }


    #stopCamera {

      background: #dc3545;

      color: white;

    }


    #switchCamera {

      margin-top: 10px;

      background: #6f42c1;

      color: white;

    }


    #backToScanner {

      margin-top: 10px;

      background: #343a40;

      color: white;

    }


    .divider {

      text-align: center;

      color: #777777;

      margin: 18px 0;

      font-weight: bold;

    }


    /* =========================
       UPLOAD
    ========================= */

    .upload-section {

      border-top:
        1px solid #dddddd;

      padding-top: 18px;

    }


    label {

      display: block;

      background: #0d6efd;

      color: white;

    }


    #qrFile {

      display: none;

    }


    #preview {

      width: 100%;

      max-height: 300px;

      object-fit: contain;

      display: none;

      margin-top: 15px;

      border-radius: 10px;

      background: #eeeeee;

    }


    /* =========================
       STATUS
    ========================= */

    #status {

      display: none;

      margin-top: 18px;

      padding: 18px;

      border-radius: 12px;

      text-align: center;

      font-weight: bold;

      font-size: 21px;

      line-height: 1.35;

    }


    .processing {

      background: #fff3cd;

      color: #664d03;

    }


    .timein,
    .success {

      background: #d1e7dd;

      color: #0f5132;

    }


    .timeout,
    .error {

      background: #f8d7da;

      color: #842029;

    }


    /* =========================
       DETAILS
    ========================= */

    .details-box {

      display: none;

      margin-top: 18px;

      padding: 18px;

      background: #f8f9fa;

      border:
        1px solid #dddddd;

      border-radius: 12px;

    }


    .details-title {

      text-align: center;

      font-size: 18px;

      font-weight: bold;

      margin-bottom: 12px;

    }


    .detail-row {

      display: flex;

      justify-content: space-between;

      gap: 12px;

      padding: 11px 0;

      border-bottom:
        1px solid #e1e1e1;

    }


    .detail-row:last-child {

      border-bottom: none;

    }


    .detail-label {

      color: #666666;

      flex:
        0 0 42%;

      font-size: 14px;

    }


    .detail-value {

      flex: 1;

      text-align: right;

      font-weight: bold;

      word-break: break-word;

    }


    .plate-value {

      font-size: 18px;

      letter-spacing: 1px;

    }


    /* =========================
       SCAN AGAIN
    ========================= */

    #scanAgain {

      display: none;

      width: 100%;

      margin-top: 12px;

      background: #212529;

      color: white;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      body {

        padding: 8px;

      }


      .container {

        border-radius: 14px;

        padding: 14px;

      }


      h1 {

        font-size: 21px;

      }


      .buttons {

        flex-direction: column;

      }


      .camera-box {

        aspect-ratio: 1 / 1;

      }


      button,
      label {

        min-height: 50px;

        font-size: 15px;

      }

    }


    @media (max-width: 450px) {

      .detail-row {

        flex-direction: column;

        gap: 4px;

      }


      .detail-label,
      .detail-value {

        width: 100%;

        text-align: left;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    QR TIME IN / TIME OUT
  </h1>


  <div class="subtitle">
    Scan or upload QR Code
  </div>


  <!-- =========================
       CAMERA
  ========================== -->

  <div class="camera-box">

    <video
      id="video"
      autoplay
      muted
      playsinline
      webkit-playsinline>
    </video>


    <div class="scan-frame"></div>

    <div class="scan-line"></div>

  </div>


  <canvas id="canvas"></canvas>


  <div
    id="cameraStatus"
    class="camera-status">

    🔴 Camera OFF

  </div>


  <!-- =========================
       CAMERA CONTROLS
  ========================== -->

  <div class="buttons">

    <button
      id="startCamera"
      type="button"
      onclick="startCamera()">

      📷 START CAMERA

    </button>


    <button
      id="stopCamera"
      type="button"
      onclick="stopCamera()">

      ⛔ STOP CAMERA

    </button>

  </div>


  <button
    id="switchCamera"
    type="button"
    onclick="switchCamera()">

    🔄 SWITCH CAMERA

  </button>


  <button
    id="backToScanner"
    type="button"
    onclick="switchBackToScanner()">

    ↩️ SWITCH BACK TO SCANNER

  </button>


  <div class="divider">
    OR
  </div>


  <!-- =========================
       UPLOAD QR
  ========================== -->

  <div class="upload-section">

    <label for="qrFile">

      📤 UPLOAD QR CODE

    </label>


    <input
      type="file"
      id="qrFile"
      accept="image/*">


    <img
      id="preview"
      alt="QR Preview">

  </div>


  <!-- =========================
       DETAILS
  ========================== -->

  <div
    id="detailsBox"
    class="details-box">


    <div class="details-title">

      PERSON / VEHICLE DETAILS

    </div>


    <div class="detail-row">

      <div class="detail-label">
        Rank / Full Name
      </div>

      <div
        id="detailName"
        class="detail-value">
        -
      </div>

    </div>


    <div class="detail-row">

      <div class="detail-label">
        Office / Unit
      </div>

      <div
        id="detailOffice"
        class="detail-value">
        -
      </div>

    </div>


    <div class="detail-row">

      <div class="detail-label">
        Vehicle / Model
      </div>

      <div
        id="detailVehicle"
        class="detail-value">
        -
      </div>

    </div>


    <div class="detail-row">

      <div class="detail-label">
        Contact Number
      </div>

      <div
        id="detailContact"
        class="detail-value">
        -
      </div>

    </div>


    <div class="detail-row">

      <div class="detail-label">
        Plate Number
      </div>

      <div
        id="detailPlate"
        class="detail-value plate-value">
        -
      </div>

    </div>


  </div>


  <!-- =========================
       RESULT
  ========================== -->

  <div id="status"></div>


  <button
    id="scanAgain"
    type="button"
    onclick="resetScanner()">

    🔄 SCAN ANOTHER QR

  </button>


</div>


<script>


/* =========================================================
   GOOGLE APPS SCRIPT WEB APP
   ========================================================= */

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbw_ivy3MXSWWlhlqVD6c6IRlRC0YJ67NBjeUJrSKuHGgVetor6LA8Q9-fQQ5gRkxmvJZw/exec";


/* =========================================================
   ELEMENTS
   ========================================================= */

const video =
  document.getElementById("video");


const canvas =
  document.getElementById("canvas");


const ctx =
  canvas.getContext(
    "2d",
    {
      willReadFrequently: true
    }
  );


const fileInput =
  document.getElementById("qrFile");


const preview =
  document.getElementById("preview");


const statusBox =
  document.getElementById("status");


const detailsBox =
  document.getElementById("detailsBox");


const scanAgainButton =
  document.getElementById("scanAgain");


const cameraStatus =
  document.getElementById("cameraStatus");


const switchButton =
  document.getElementById("switchCamera");


const backButton =
  document.getElementById("backToScanner");


const detailName =
  document.getElementById("detailName");


const detailOffice =
  document.getElementById("detailOffice");


const detailVehicle =
  document.getElementById("detailVehicle");


const detailContact =
  document.getElementById("detailContact");


const detailPlate =
  document.getElementById("detailPlate");


/* =========================================================
   VARIABLES
   ========================================================= */

let stream = null;

let scanning = false;

let processing = false;

let scanAnimationFrame = null;

let cameras = [];

let currentCameraIndex = 0;

let preferredFacingMode =
  "environment";

let lastQR = "";

let lastScanTime = 0;


/*
 * Camera debounce only.
 *
 * This does NOT limit the number
 * of TIME IN / TIME OUT scans.
 */

const DUPLICATE_DELAY = 2500;


/* =========================================================
   CAMERA STATUS
   ========================================================= */

function setCameraStatus(
  text,
  background,
  color
) {

  cameraStatus.innerHTML =
    text;

  cameraStatus.style.background =
    background;

  cameraStatus.style.color =
    color;

}


/* =========================================================
   LOAD CAMERAS
   ========================================================= */

async function loadCameras() {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.enumerateDevices
  ) {

    cameras = [];

    updateSwitchButton();

    return;

  }


  try {

    const devices =
      await navigator.mediaDevices
        .enumerateDevices();


    cameras =
      devices.filter(
        function(device) {

          return (
            device.kind ===
            "videoinput"
          );

        }
      );


    console.log(
      "Available cameras:",
      cameras
    );


    updateSwitchButton();

  }

  catch (error) {

    console.error(
      "Camera enumeration error:",
      error
    );


    cameras = [];

    updateSwitchButton();

  }

}


/* =========================================================
   START CAMERA
   ========================================================= */

async function startCamera() {

  if (processing) {

    return;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showStatus(
      "CAMERA NOT SUPPORTED<br>" +
      "<small>" +
      "Please use a modern browser " +
      "with HTTPS." +
      "</small>",
      "error"
    );

    return;

  }


  try {

    stopCamera();


    hideResult();


    /*
     * Preferred camera.
     */

    let constraints = {

      video: {

        facingMode:
          preferredFacingMode,

        width: {
          ideal: 1280
        },

        height: {
          ideal: 720
        }

      },

      audio: false

    };


    try {

      stream =
        await navigator.mediaDevices
          .getUserMedia(
            constraints
          );

    }

    catch (firstError) {

      console.warn(
        "Preferred camera failed.",
        firstError
      );


      /*
       * Generic fallback.
       */

      stream =
        await navigator.mediaDevices
          .getUserMedia({

            video: {

              width: {
                ideal: 1280
              },

              height: {
                ideal: 720
              }

            },

            audio: false

          });

    }


    video.srcObject =
      stream;


    video.setAttribute(
      "playsinline",
      ""
    );


    video.setAttribute(
      "webkit-playsinline",
      ""
    );


    await video.play();


    scanning = true;


    await loadCameras();


    /*
     * Remember actual facing mode
     * when browser exposes it.
     */

    try {

      const track =
        stream.getVideoTracks()[0];


      if (
        track &&
        track.getSettings
      ) {

        const settings =
          track.getSettings();


        if (
          settings.facingMode
        ) {

          preferredFacingMode =
            settings.facingMode;

        }

      }

    }

    catch (ignore) {}


    setCameraStatus(
      "🟢 CAMERA ON",
      "#d1e7dd",
      "#0f5132"
    );


    updateSwitchButton();


    scanCamera();

  }

  catch (error) {

    console.error(
      "Camera error:",
      error
    );


    scanning = false;


    stopCamera();


    let message =
      "CAMERA ERROR";


    if (
      error &&
      error.name ===
      "NotAllowedError"
    ) {

      message =
        "CAMERA PERMISSION BLOCKED<br>" +
        "<small>" +
        "Allow camera access for this " +
        "website, then try again." +
        "</small>";

    }

    else if (
      error &&
      error.name ===
      "NotFoundError"
    ) {

      message =
        "NO CAMERA FOUND<br>" +
        "<small>" +
        "Please connect or enable a camera." +
        "</small>";

    }

    else if (
      error &&
      error.name ===
      "NotReadableError"
    ) {

      message =
        "CAMERA IS BUSY<br>" +
        "<small>" +
        "Close other applications using " +
        "the camera and try again." +
        "</small>";

    }

    else {

      message =
        "UNABLE TO START CAMERA<br>" +
        "<small>" +
        "Please check browser permissions " +
        "and HTTPS." +
        "</small>";

    }


    showStatus(
      message,
      "error"
    );

  }

}


/* =========================================================
   STOP CAMERA
   ========================================================= */

function stopCamera() {

  scanning = false;


  if (scanAnimationFrame) {

    cancelAnimationFrame(
      scanAnimationFrame
    );

    scanAnimationFrame = null;

  }


  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          try {

            track.stop();

          }

          catch (ignore) {}

        }
      );

    stream = null;

  }


  try {

    video.pause();

  }

  catch (ignore) {}


  video.srcObject =
    null;


  setCameraStatus(
    "🔴 Camera OFF",
    "#e9ecef",
    "#212529"
  );

}


/* =========================================================
   SWITCH CAMERA
   ========================================================= */

async function switchCamera() {

  if (processing) {

    return;

  }


  stopCamera();


  if (
    preferredFacingMode ===
    "environment"
  ) {

    preferredFacingMode =
      "user";

  }

  else {

    preferredFacingMode =
      "environment";

  }


  await startCamera();

}


/* =========================================================
   UPDATE SWITCH BUTTON
   ========================================================= */

function updateSwitchButton() {

  if (!switchButton) {

    return;

  }


  if (
    preferredFacingMode ===
    "environment"
  ) {

    switchButton.innerHTML =
      "🔄 SWITCH CAMERA — BACK";

  }

  else {

    switchButton.innerHTML =
      "🔄 SWITCH CAMERA — FRONT";

  }


  switchButton.disabled =
    false;

}


/* =========================================================
   CAMERA QR SCANNER
   ========================================================= */

function scanCamera() {

  if (
    !scanning ||
    processing
  ) {

    return;

  }


  if (
    !video ||
    video.readyState <
      video.HAVE_ENOUGH_DATA
  ) {

    scanAnimationFrame =
      requestAnimationFrame(
        scanCamera
      );

    return;

  }


  if (
    video.videoWidth <= 0 ||
    video.videoHeight <= 0
  ) {

    scanAnimationFrame =
      requestAnimationFrame(
        scanCamera
      );

    return;

  }


  if (
    canvas.width !==
      video.videoWidth ||
    canvas.height !==
      video.videoHeight
  ) {

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;

  }


  try {

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const imageData =
      ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    const code =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height,
        {
          inversionAttempts:
            "attemptBoth"
        }
      );


    if (
      code &&
      code.data
    ) {

      handleQR(
        code.data
      );

      return;

    }

  }

  catch (error) {

    console.error(
      "QR frame error:",
      error
    );

  }


  scanAnimationFrame =
    requestAnimationFrame(
      scanCamera
    );

}


/* =========================================================
   UPLOAD QR
   ========================================================= */

fileInput.addEventListener(
  "change",
  function(event) {

    const file =
      event.target.files &&
      event.target.files[0];


    if (!file) {

      return;

    }


    if (
      !file.type ||
      !file.type.startsWith("image/")
    ) {

      showStatus(
        "INVALID FILE<br>" +
        "<small>" +
        "Please select an image." +
        "</small>",
        "error"
      );

      return;

    }


    stopCamera();


    processing = false;


    hideDetails();


    showStatus(
      "READING QR CODE...",
      "processing"
    );


    const reader =
      new FileReader();


    reader.onload =
      function(e) {

        preview.src =
          e.target.result;

        preview.style.display =
          "block";


        const img =
          new Image();


        img.onload =
          function() {

            scanUploadedImage(
              img
            );

          };


        img.onerror =
          function() {

            showStatus(
              "IMAGE COULD NOT BE READ.",
              "error"
            );


            scanAgainButton.style.display =
              "block";

          };


        img.src =
          e.target.result;

      };


    reader.onerror =
      function() {

        showStatus(
          "UNABLE TO READ IMAGE.",
          "error"
        );


        scanAgainButton.style.display =
          "block";

      };


    reader.readAsDataURL(
      file
    );

  }
);


/* =========================================================
   SCAN UPLOADED IMAGE
   ========================================================= */

function scanUploadedImage(
  img
) {

  try {

    const width =
      img.naturalWidth ||
      img.width;


    const height =
      img.naturalHeight ||
      img.height;


    if (
      !width ||
      !height
    ) {

      throw new Error(
        "Invalid image dimensions"
      );

    }


    canvas.width =
      width;

    canvas.height =
      height;


    ctx.clearRect(
      0,
      0,
      width,
      height
    );


    ctx.drawImage(
      img,
      0,
      0,
      width,
      height
    );


    const imageData =
      ctx.getImageData(
        0,
        0,
        width,
        height
      );


    const code =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height,
        {
          inversionAttempts:
            "attemptBoth"
        }
      );


    if (
      !code ||
      !code.data
    ) {

      showStatus(
        "QR CODE NOT FOUND<br>" +
        "<small>" +
        "Please upload a clear QR image." +
        "</small>",
        "error"
      );


      scanAgainButton.style.display =
        "block";


      return;

    }


    handleQR(
      code.data
    );

  }

  catch (error) {

    console.error(
      "Uploaded QR error:",
      error
    );


    showStatus(
      "UNABLE TO READ QR CODE<br>" +
      "<small>" +
      "Please try another clear image." +
      "</small>",
      "error"
    );


    scanAgainButton.style.display =
      "block";

  }

}


/* =========================================================
   NORMALIZE QR VALUE
   ========================================================= */

function normalizeQRValue(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)
    .trim();

}


/* =========================================================
   HANDLE QR
   ========================================================= */

function handleQR(
  qrValue
) {

  qrValue =
    normalizeQRValue(
      qrValue
    );


  if (!qrValue) {

    return;

  }


  const now =
    Date.now();


  /*
   * Short camera debounce only.
   *
   * Same QR can be scanned again
   * after the debounce period.
   */

  if (
    qrValue === lastQR &&
    now - lastScanTime <
      DUPLICATE_DELAY
  ) {

    return;

  }


  lastQR =
    qrValue;


  lastScanTime =
    now;


  processing = true;


  stopCamera();


  showStatus(
    "PROCESSING...",
    "processing"
  );


  const callbackName =
    "qrCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 1000000
    );


  let script = null;


  /*
   * JSONP callback.
   */

  window[callbackName] =
    function(result) {

      try {

        processing = false;


        if (!result) {

          showStatus(
            "NO RESPONSE FROM SERVER.",
            "error"
          );


          scanAgainButton.style.display =
            "block";


          return;

        }


        if (result.success) {

          showDetails(
            result
          );


          if (
            result.action ===
            "TIME IN"
          ) {

            showStatus(
              "🟢 TIME IN",
              "timein"
            );

          }

          else if (
            result.action ===
            "TIME OUT"
          ) {

            showStatus(
              "🔴 TIME OUT",
              "timeout"
            );

          }

          else {

            showStatus(
              result.message ||
              "SCAN SUCCESSFUL",
              "success"
            );

          }

        }

        else {

          hideDetails();


          showStatus(
            result.message ||
            "INVALID QR CODE",
            "error"
          );

        }


        scanAgainButton.style.display =
          "block";

      }

      catch (error) {

        console.error(
          "Callback processing error:",
          error
        );


        processing = false;


        showStatus(
          "SYSTEM ERROR<br>" +
          "<small>" +
          "Please scan again." +
          "</small>",
          "error"
        );


        scanAgainButton.style.display =
          "block";

      }

      finally {

        try {

          delete window[
            callbackName
          ];

        }

        catch (ignore) {}


        if (
          script &&
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }

    };


  /*
   * JSONP request.
   */

  script =
    document.createElement(
      "script"
    );


  const encodedQR =
    encodeURIComponent(
      qrValue
    );


  script.src =
    GAS_URL +
    "?action=processScan" +
    "&qr=" +
    encodedQR +
    "&callback=" +
    callbackName;


  /*
   * Network error.
   */

  script.onerror =
    function() {

      processing = false;


      try {

        delete window[
          callbackName
        ];

      }

      catch (ignore) {}


      showStatus(
        "CONNECTION ERROR<br>" +
        "<small>" +
        "Unable to contact Google Apps Script." +
        "</small>",
        "error"
      );


      scanAgainButton.style.display =
        "block";


      if (
        script &&
        script.parentNode
      ) {

        script.parentNode
          .removeChild(
            script
          );

      }

    };


  document.body.appendChild(
    script
  );

}


/* =========================================================
   SHOW DETAILS
   ========================================================= */

function showDetails(
  result
) {

  detailName.textContent =
    valueOrDash(
      result.name
    );


  detailOffice.textContent =
    valueOrDash(
      result.office
    );


  detailVehicle.textContent =
    valueOrDash(
      result.vehicle
    );


  detailContact.textContent =
    valueOrDash(
      result.contact
    );


  detailPlate.textContent =
    valueOrDash(
      result.plate
    );


  detailsBox.style.display =
    "block";

}


/* =========================================================
   VALUE OR DASH
   ========================================================= */

function valueOrDash(
  value
) {

  if (
    value === null ||
    value === undefined ||
    String(value).trim() === ""
  ) {

    return "-";

  }


  return String(value);

}


/* =========================================================
   HIDE DETAILS
   ========================================================= */

function hideDetails() {

  detailsBox.style.display =
    "none";


  detailName.textContent =
    "-";


  detailOffice.textContent =
    "-";


  detailVehicle.textContent =
    "-";


  detailContact.textContent =
    "-";


  detailPlate.textContent =
    "-";

}


/* =========================================================
   SHOW STATUS
   ========================================================= */

function showStatus(
  message,
  type
) {

  statusBox.innerHTML =
    message;


  statusBox.className =
    "";


  if (type) {

    statusBox.classList.add(
      type
    );

  }


  statusBox.style.display =
    "block";

}


/* =========================================================
   HIDE RESULT
   ========================================================= */

function hideResult() {

  statusBox.innerHTML =
    "";

  statusBox.className =
    "";

  statusBox.style.display =
    "none";


  hideDetails();


  scanAgainButton.style.display =
    "none";

}


/* =========================================================
   RESET SCANNER
   ========================================================= */

async function resetScanner() {

  if (processing) {

    return;

  }


  stopCamera();


  processing = false;


  /*
   * Reset duplicate protection.
   */

  lastQR = "";

  lastScanTime = 0;


  fileInput.value =
    "";


  preview.src =
    "";

  preview.style.display =
    "none";


  hideResult();


  await startCamera();

}


/* =========================================================
   SWITCH BACK TO SCANNER
   ========================================================= */

async function switchBackToScanner() {

  if (processing) {

    return;

  }


  stopCamera();


  processing = false;


  lastQR = "";

  lastScanTime = 0;


  fileInput.value =
    "";


  preview.src =
    "";

  preview.style.display =
    "none";


  hideResult();


  await startCamera();

}


/* =========================================================
   PAGE CLOSE
   ========================================================= */

window.addEventListener(
  "beforeunload",
  function() {

    stopCamera();

  }
);


/* =========================================================
   PAGE VISIBILITY
   ========================================================= */

document.addEventListener(
  "visibilitychange",
  function() {

    /*
     * Release camera when page
     * becomes hidden.
     */

    if (
      document.hidden
    ) {

      if (scanning) {

        stopCamera();

      }

      return;

    }

  }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

window.addEventListener(
  "load",
  async function() {

    await loadCameras();


    updateSwitchButton();

  }
);


</script>
