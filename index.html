<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>QR Time In / Time Out Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f4f6f8;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,.15);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 24px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 18px;
    }

    .camera-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #111;
      border-radius: 15px;
      overflow: hidden;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #canvas {
      display: none;
    }

    .scan-frame {
      position: absolute;
      width: 68%;
      height: 68%;
      left: 16%;
      top: 16%;
      border: 3px solid #00ff66;
      border-radius: 16px;
      pointer-events: none;
    }

    .scan-line {
      position: absolute;
      width: 80%;
      left: 10%;
      height: 2px;
      background: #00ff66;
      animation: scan 2s linear infinite;
      pointer-events: none;
    }

    @keyframes scan {

      0% {
        top: 10%;
      }

      50% {
        top: 90%;
      }

      100% {
        top: 10%;
      }

    }

    .camera-status {
      margin-top: 10px;
      padding: 10px;
      text-align: center;
      border-radius: 8px;
      background: #e9ecef;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 9px;
      padding: 14px 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      background: #198754;
      color: white;
    }

    #stopButton {
      background: #dc3545;
      color: white;
    }

    #switchButton {
      width: 100%;
      margin-top: 10px;
      background: #7952b3;
      color: white;
    }

    #scanAgainButton {
      width: 100%;
      margin-top: 10px;
      background: #0d6efd;
      color: white;
      display: none;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
    }

    .info {
      background: #fff3cd;
      color: #664d03;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    .success {
      background: #d1e7dd;
      color: #0f5132;
    }

    .details {
      margin-top: 15px;
      text-align: left;
      background: #f8f9fa;
      border-radius: 10px;
      padding: 14px;
      line-height: 1.6;
    }

    .details-title {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .action {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .time-in {
      background: #00ff00;
      color: #000000;
    }

    .time-out {
      background: #ff0000;
      color: #ffffff;
    }

    .detail-row {
      margin-bottom: 5px;
    }

    .detail-label {
      font-weight: bold;
    }

    .help {
      margin-top: 18px;
      padding: 14px;
      background: #f8f9fa;
      border-radius: 10px;
      color: #555;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 450px) {

      .buttons {
        flex-direction: column;
      }

    }

  </style>

</head>

<body>

<div class="container">

  <h1>
    QR TIME IN / TIME OUT
  </h1>

  <div class="subtitle">
    Camera QR Scanner
  </div>


  <!-- CAMERA -->

  <div class="camera-box">

    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>

    <div class="scan-frame"></div>

    <div class="scan-line"></div>

  </div>


  <canvas id="canvas"></canvas>


  <!-- CAMERA STATUS -->

  <div
    id="cameraStatus"
    class="camera-status">

    🔴 CAMERA OFF

  </div>


  <!-- BUTTONS -->

  <div class="buttons">

    <button
      id="startButton"
      onclick="startCamera()">

      📷 START CAMERA

    </button>


    <button
      id="stopButton"
      onclick="stopCamera()">

      ⛔ STOP CAMERA

    </button>

  </div>


  <button
    id="switchButton"
    onclick="switchCamera()">

    🔄 SWITCH CAMERA

  </button>


  <button
    id="scanAgainButton"
    onclick="scanAgain()">

    📷 SCAN AGAIN

  </button>


  <!-- MESSAGE -->

  <div
    id="message">
  </div>


  <!-- DETAILS -->

  <div
    id="details"
    class="details"
    style="display:none;">

  </div>


  <!-- HELP -->

  <div class="help">

    <b>How to use:</b>
    <br>

    1. Press <b>START CAMERA</b>.
    <br>

    2. Allow camera permission.
    <br>

    3. Point the camera at the QR Code.
    <br>

    4. QR can contain:
    <br>

    &nbsp;&nbsp;&nbsp;• O-123456
    <br>

    &nbsp;&nbsp;&nbsp;• 023449
    <br>

    &nbsp;&nbsp;&nbsp;• 123456
    <br>

    5. The system will automatically process
    TIME IN / TIME OUT.

  </div>

</div>


<script>


/************************************************************
 * GOOGLE APPS SCRIPT WEB APP
 ************************************************************/

const GAS_WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbxKPOKY98yBA9Y-lZOiOa9Wzxx7a2nP6fwIE74yYKZGHjPh9QcpuB7pBcK8UQaOegON9g/exec";


/************************************************************
 * ELEMENTS
 ************************************************************/

const video =
  document.getElementById(
    "video"
  );


const canvas =
  document.getElementById(
    "canvas"
  );


const ctx =
  canvas.getContext(
    "2d",
    {
      willReadFrequently: true
    }
  );


const cameraStatus =
  document.getElementById(
    "cameraStatus"
  );


const messageBox =
  document.getElementById(
    "message"
  );


const detailsBox =
  document.getElementById(
    "details"
  );


const scanAgainButton =
  document.getElementById(
    "scanAgainButton"
  );


/************************************************************
 * VARIABLES
 ************************************************************/

let stream = null;

let scanning = false;

let processing = false;

let currentFacingMode =
  "environment";

let lastQR = "";

let lastScanTime = 0;

let jsonpCounter = 0;


/************************************************************
 * START CAMERA
 ************************************************************/

async function startCamera() {

  if (processing) {
    return;
  }


  hideMessage();

  hideDetails();

  scanAgainButton.style.display =
    "none";


  stopCamera();


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showMessage(
      "CAMERA NOT SUPPORTED",
      "error"
    );

    return;

  }


  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal:
              currentFacingMode
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    scanning = true;


    cameraStatus.innerHTML =
      "🟢 CAMERA ON";


    cameraStatus.style.background =
      "#d1e7dd";


    cameraStatus.style.color =
      "#0f5132";


    requestAnimationFrame(
      scanCamera
    );

  }

  catch (error) {

    console.error(
      error
    );


    cameraStatus.innerHTML =
      "🔴 CAMERA ERROR";


    cameraStatus.style.background =
      "#f8d7da";


    cameraStatus.style.color =
      "#842029";


    showMessage(

      "CAMERA PERMISSION BLOCKED<br>" +

      "<small>" +

      "Allow camera access in your browser, " +

      "then press START CAMERA again." +

      "</small>",

      "error"

    );

  }

}


/************************************************************
 * STOP CAMERA
 ************************************************************/

function stopCamera() {

  scanning = false;


  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    stream = null;

  }


  video.srcObject =
    null;


  cameraStatus.innerHTML =
    "🔴 CAMERA OFF";


  cameraStatus.style.background =
    "#e9ecef";


  cameraStatus.style.color =
    "#212529";

}


/************************************************************
 * SWITCH CAMERA
 ************************************************************/

async function switchCamera() {

  if (processing) {
    return;
  }


  currentFacingMode =
    currentFacingMode ===
      "environment"

      ? "user"

      : "environment";


  await startCamera();

}


/************************************************************
 * SCAN AGAIN
 ************************************************************/

function scanAgain() {

  processing = false;

  lastQR = "";

  lastScanTime = 0;

  hideMessage();

  hideDetails();

  scanAgainButton.style.display =
    "none";

  startCamera();

}


/************************************************************
 * CAMERA SCANNING
 ************************************************************/

function scanCamera() {

  if (
    !scanning ||
    processing
  ) {

    return;

  }


  if (
    video.readyState !==
    video.HAVE_ENOUGH_DATA
  ) {

    requestAnimationFrame(
      scanCamera
    );

    return;

  }


  if (
    video.videoWidth <= 0 ||
    video.videoHeight <= 0
  ) {

    requestAnimationFrame(
      scanCamera
    );

    return;

  }


  canvas.width =
    video.videoWidth;


  canvas.height =
    video.videoHeight;


  ctx.drawImage(

    video,

    0,

    0,

    canvas.width,

    canvas.height

  );


  const imageData =
    ctx.getImageData(

      0,

      0,

      canvas.width,

      canvas.height

    );


  const code =
    jsQR(

      imageData.data,

      imageData.width,

      imageData.height,

      {

        inversionAttempts:
          "attemptBoth"

      }

    );


  if (
    code &&
    code.data
  ) {

    handleQR(
      code.data
    );

    return;

  }


  requestAnimationFrame(
    scanCamera
  );

}


/************************************************************
 * HANDLE QR
 ************************************************************/

function handleQR(
  qrValue
) {

  if (!qrValue) {
    return;
  }


  /*
   * IMPORTANT:
   *
   * DO NOT modify the QR.
   *
   * The QR may be:
   *
   * O-123456
   * 023449
   * 123456
   *
   * We send exactly what the camera reads.
   */

  qrValue =
    String(
      qrValue
    ).trim();


  if (!qrValue) {
    return;
  }


  const now =
    Date.now();


  /*
   * Prevent duplicate scan.
   */

  if (

    qrValue === lastQR &&

    now - lastScanTime < 3000

  ) {

    return;

  }


  lastQR =
    qrValue;


  lastScanTime =
    now;


  processing = true;

  scanning = false;


  stopCamera();


  showMessage(

    "QR CODE FOUND<br><br>" +

    "<small>" +

    "QR: " +

    escapeHtml(
      qrValue
    ) +

    "<br><br>" +

    "PROCESSING..." +

    "</small>",

    "info"

  );


  /*
   * Check Web App URL.
   */

  if (

    !GAS_WEB_APP_URL ||

    GAS_WEB_APP_URL.indexOf(
      "PASTE_YOUR"
    ) !== -1

  ) {

    processing = false;


    showMessage(

      "WEB APP URL NOT SET",

      "error"

    );


    return;

  }


  /*
   * Send QR using JSONP.
   */

  sendQRToGoogle(
    qrValue
  );

}


/************************************************************
 * SEND QR TO GOOGLE APPS SCRIPT
 *
 * JSONP is used because this scanner
 * is hosted on GitHub Pages.
 ************************************************************/

function sendQRToGoogle(
  qrValue
) {

  const callbackName =
    "qrCallback_" +
    Date.now() +
    "_" +
    (++jsonpCounter);


  /*
   * Create global callback.
   */

  window[callbackName] =
    function(result) {

      try {

        handleServerResult(
          result
        );

      }

      finally {

        try {

          delete window[
            callbackName
          ];

        }

        catch (ignore) {}


        try {

          script.remove();

        }

        catch (ignore) {}

      }

    };


  const script =
    document.createElement(
      "script"
    );


  const url =
    GAS_WEB_APP_URL +

    "?action=processScan" +

    "&qr=" +

    encodeURIComponent(
      qrValue
    ) +

    "&callback=" +

    encodeURIComponent(
      callbackName
    );


  script.src =
    url;


  script.async =
    true;


  /*
   * Handle network/server error.
   */

  script.onerror =
    function() {

      try {

        delete window[
          callbackName
        ];

      }

      catch (ignore) {}


      script.remove();


      processing = false;


      showMessage(

        "SERVER CONNECTION ERROR<br><br>" +

        "<small>" +

        "Hindi makakonekta sa Google Apps Script." +

        "</small>",

        "error"

      );


      scanAgainButton.style.display =
        "block";

    };


  document.body.appendChild(
    script
  );


  /*
   * Timeout protection.
   */

  setTimeout(
    function() {

      if (
        window[
          callbackName
        ]
      ) {

        try {

          delete window[
            callbackName
          ];

        }

        catch (ignore) {}


        try {

          script.remove();

        }

        catch (ignore) {}


        processing = false;


        showMessage(

          "SERVER TIMEOUT<br><br>" +

          "<small>" +

          "Walang response mula sa Google Apps Script." +

          "</small>",

          "error"

        );


        scanAgainButton.style.display =
          "block";

      }

    },
    20000
  );

}


/************************************************************
 * SERVER RESULT
 ************************************************************/

function handleServerResult(
  result
) {

  processing = false;


  if (
    !result
  ) {

    showMessage(
      "INVALID SERVER RESPONSE",
      "error"
    );


    scanAgainButton.style.display =
      "block";


    return;

  }


  /*
   * ERROR
   */

  if (
    result.success !== true
  ) {

    showMessage(

      escapeHtml(
        result.message ||
        "SYSTEM ERROR"
      ),

      "error"

    );


    scanAgainButton.style.display =
      "block";


    return;

  }


  /*
   * SUCCESS
   */

  const action =
    String(
      result.action || ""
    ).toUpperCase();


  let actionClass =
    "";


  if (
    action ===
    "TIME IN"
  ) {

    actionClass =
      "time-in";

  }

  else if (
    action ===
    "TIME OUT"
  ) {

    actionClass =
      "time-out";

  }


  showMessage(

    "✓ " +

    escapeHtml(
      action
    ) +

    "<br><small>" +

    escapeHtml(
      result.dateTime ||
      ""
    ) +

    "</small>",

    "success"

  );


  /*
   * SHOW COMPLETE DETAILS
   */

  detailsBox.innerHTML =

    '<div class="details-title">' +

    'PERSON DETAILS' +

    '</div>' +


    '<div class="action ' +
    actionClass +
    '">' +

    escapeHtml(
      action
    ) +

    '</div>' +


    '<div class="detail-row">' +

    '<span class="detail-label">' +
    'QR CODE: ' +
    '</span>' +

    escapeHtml(
      result.serial ||
      result.personId ||
      ""
    ) +

    '</div>' +


    '<div class="detail-row">' +

    '<span class="detail-label">' +
    'NAME: ' +
    '</span>' +

    escapeHtml(
      result.name ||
      ""
    ) +

    '</div>' +


    '<div class="detail-row">' +

    '<span class="detail-label">' +
    'OFFICE/AGENCY: ' +
    '</span>' +

    escapeHtml(
      result.office ||
      ""
    ) +

    '</div>' +


    '<div class="detail-row">' +

    '<span class="detail-label">' +
    'RANK/POSITION: ' +
    '</span>' +

    escapeHtml(
      result.rank ||
      ""
    ) +

    '</div>' +


    '<div class="detail-row">' +

    '<span class="detail-label">' +
    'AGE: ' +
    '</span>' +

    escapeHtml(
      result.age ||
      ""
    ) +

    '</div>' +


    '<div class="detail-row">' +

    '<span class="detail-label">' +
    'CONTACT: ' +
    '</span>' +

    escapeHtml(
      result.contact ||
      ""
    ) +

    '</div>' +


    '<div class="detail-row">' +

    '<span class="detail-label">' +
    'GENDER: ' +
    '</span>' +

    escapeHtml(
      result.gender ||
      ""
    ) +

    '</div>' +


    '<div class="detail-row">' +

    '<span class="detail-label">' +
    'VEHICLE: ' +
    '</span>' +

    escapeHtml(
      result.vehicle ||
      ""
    ) +

    '</div>' +


    '<div class="detail-row">' +

    '<span class="detail-label">' +
    'COLOR: ' +
    '</span>' +

    escapeHtml(
      result.color ||
      ""
    ) +

    '</div>' +


    '<div class="detail-row">' +

    '<span class="detail-label">' +
    'PLATE: ' +
    '</span>' +

    escapeHtml(
      result.plate ||
      ""
    ) +

    '</div>' +


    '<div class="detail-row">' +

    '<span class="detail-label">' +
    'PURPOSE: ' +
    '</span>' +

    escapeHtml(
      result.purpose ||
      ""
    ) +

    '</div>' +


    '<div class="detail-row">' +

    '<span class="detail-label">' +
    'DATE/TIME: ' +
    '</span>' +

    escapeHtml(
      result.dateTime ||
      ""
    ) +

    '</div>';


  detailsBox.style.display =
    "block";


  /*
   * Show scan again button.
   */

  scanAgainButton.style.display =
    "block";

}


/************************************************************
 * MESSAGE
 ************************************************************/

function showMessage(
  message,
  type
) {

  messageBox.innerHTML =
    message;


  messageBox.className =
    "";


  messageBox.classList.add(
    type
  );


  messageBox.style.display =
    "block";

}


/************************************************************
 * HIDE MESSAGE
 ************************************************************/

function hideMessage() {

  messageBox.innerHTML =
    "";


  messageBox.className =
    "";


  messageBox.style.display =
    "none";

}


/************************************************************
 * HIDE DETAILS
 ************************************************************/

function hideDetails() {

  detailsBox.innerHTML =
    "";


  detailsBox.style.display =
    "none";

}


/************************************************************
 * HTML ESCAPE
 *
 * Prevent QR/server text from being
 * interpreted as HTML.
 ************************************************************/

function escapeHtml(
  value
) {

  return String(
    value == null
      ? ""
      : value
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/************************************************************
 * CLEANUP
 ************************************************************/

window.addEventListener(
  "beforeunload",
  function() {

    stopCamera();

  }
);

</script>

</body>
</html>
