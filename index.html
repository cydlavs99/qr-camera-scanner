<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CGFLEET QR Monitoring</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6f9;
      color: #222;
    }

    .header {
      background: #17365d;
      color: white;
      padding: 18px 15px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: 0.9;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 20px auto;
      padding: 0 15px 40px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      text-align: center;
      color: #17365d;
      font-size: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 10px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    button,
    .upload-label {
      flex: 1;
      min-width: 140px;
      border: none;
      border-radius: 8px;
      padding: 13px 15px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .btn-start {
      background: #198754;
      color: white;
    }

    .btn-stop {
      background: #dc3545;
      color: white;
    }

    .btn-upload {
      background: #0d6efd;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #qr-input-file {
      display: none;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }

    .status {
      display: none;
      padding: 16px;
      border-radius: 10px;
      color: white;
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .status.in {
      background: #198754;
    }

    .status.out {
      background: #dc3545;
    }

    .details {
      display: none;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 45% 55%;
      border-bottom: 1px solid #e6e6e6;
      padding: 10px 0;
      gap: 8px;
    }

    .detail-label {
      font-weight: bold;
      color: #555;
    }

    .detail-value {
      word-break: break-word;
      color: #111;
    }

    .scan-again {
      width: 100%;
      margin-top: 18px;
      background: #17365d;
      color: white;
    }

    .error {
      color: #dc3545;
      font-weight: bold;
    }

    .success {
      color: #198754;
      font-weight: bold;
    }

    .loading {
      color: #0d6efd;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 12px;
      padding: 10px;
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 21px;
      }

      .card {
        padding: 15px;
      }

      .detail-row {
        grid-template-columns: 1fr;
        gap: 3px;
      }

      button,
      .upload-label {
        width: 100%;
        min-width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>CGFLEET QR Monitoring</h1>
    <p>Visitor Vehicle Monitoring System</p>
  </div>

  <div class="container">

    <!-- SCANNER -->
    <div class="card" id="scanner-card">

      <h2>Scan Vehicle QR Code</h2>

      <div id="reader"></div>

      <div class="buttons">

        <button
          id="start-camera"
          class="btn-start"
          onclick="startCamera()">
          START CAMERA
        </button>

        <button
          id="stop-camera"
          class="btn-stop"
          onclick="stopCamera()"
          disabled>
          STOP CAMERA
        </button>

        <label
          for="qr-input-file"
          class="upload-label btn-upload">
          UPLOAD QR IMAGE
        </label>

        <input
          type="file"
          id="qr-input-file"
          accept="image/*">

      </div>

      <div id="message"></div>

    </div>


    <!-- RESULT -->
    <div class="card" id="result-card" style="display:none;">

      <div id="status-box" class="status"></div>

      <div class="details">

        <div class="detail-row">
          <div class="detail-label">Office / Agency / Assignment</div>
          <div class="detail-value" id="office"></div>
        </div>

        <div class="detail-row">
          <div class="detail-label">RANK / Position</div>
          <div class="detail-value" id="rank"></div>
        </div>

        <div class="detail-row">
          <div class="detail-label">First Name</div>
          <div class="detail-value" id="firstName"></div>
        </div>

        <div class="detail-row">
          <div class="detail-label">M.I</div>
          <div class="detail-value" id="middleInitial"></div>
        </div>

        <div class="detail-row">
          <div class="detail-label">Last Name</div>
          <div class="detail-value" id="lastName"></div>
        </div>

        <div class="detail-row">
          <div class="detail-label">Contact Number</div>
          <div class="detail-value" id="contact"></div>
        </div>

        <div class="detail-row">
          <div class="detail-label">Vehicle / Model</div>
          <div class="detail-value" id="vehicle"></div>
        </div>

        <div class="detail-row">
          <div class="detail-label">Color of Vehicle</div>
          <div class="detail-value" id="vehicleColor"></div>
        </div>

        <div class="detail-row">
          <div class="detail-label">Plate Number</div>
          <div class="detail-value" id="plate"></div>
        </div>

        <div class="detail-row">
          <div class="detail-label">Date / Time</div>
          <div class="detail-value" id="dateTime"></div>
        </div>

        <div class="detail-row">
          <div class="detail-label">Time In</div>
          <div class="detail-value" id="timeIn"></div>
        </div>

        <div class="detail-row">
          <div class="detail-label">Time Out</div>
          <div class="detail-value" id="timeOut"></div>
        </div>

        <div class="detail-row">
          <div class="detail-label">Purpose of Visit</div>
          <div class="detail-value" id="purpose"></div>
        </div>

      </div>

      <button
        class="scan-again"
        onclick="scanAgain()">
        SCAN AGAIN
      </button>

    </div>

    <div class="footer">
      CGFLEET QR Monitoring System
    </div>

  </div>


  <script>

    /*
     * ==========================================================
     * APPS SCRIPT WEB APP URL
     * ==========================================================
     */

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbygUbFIwIo5p3g0AyJwr1YgWjsubkpg1Zp-ev8hkNx038YSJT2wxP7garS2e4B3lb0v/exec";


    /*
     * ==========================================================
     * GLOBAL VARIABLES
     * ==========================================================
     */

    let html5QrCode = null;
    let scannerRunning = false;
    let scanProcessing = false;


    /*
     * ==========================================================
     * START CAMERA
     * ==========================================================
     */

    async function startCamera() {

      if (scannerRunning) {
        return;
      }

      showMessage("Starting camera...", "loading");

      try {

        html5QrCode = new Html5Qrcode("reader");

        const config = {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          },
          aspectRatio: 1.0
        };

        await html5QrCode.start(
          {
            facingMode: "environment"
          },
          config,
          onScanSuccess,
          onScanFailure
        );

        scannerRunning = true;

        document.getElementById("start-camera").disabled = true;
        document.getElementById("stop-camera").disabled = false;

        showMessage("Camera is ready. Scan the QR code.", "success");

      } catch (error) {

        console.error(error);

        showMessage(
          "Unable to start camera. Please allow camera permission.",
          "error"
        );

      }
    }


    /*
     * ==========================================================
     * STOP CAMERA
     * ==========================================================
     */

    async function stopCamera() {

      if (!html5QrCode || !scannerRunning) {
        return;
      }

      try {

        await html5QrCode.stop();

        scannerRunning = false;

        document.getElementById("start-camera").disabled = false;
        document.getElementById("stop-camera").disabled = true;

        showMessage("Camera stopped.", "");

      } catch (error) {

        console.error(error);

      }
    }


    /*
     * ==========================================================
     * QR SUCCESS
     * ==========================================================
     */

    function onScanSuccess(decodedText, decodedResult) {

      if (scanProcessing) {
        return;
      }

      scanProcessing = true;

      console.log("QR detected:", decodedText);

      processScannedQR(decodedText);
    }


    /*
     * ==========================================================
     * QR FAILURE
     * ==========================================================
     */

    function onScanFailure(error) {
      // Normal while camera is looking for a QR.
    }


    /*
     * ==========================================================
     * PROCESS QR
     * ==========================================================
     */

    async function processScannedQR(qrText) {

      showMessage("QR detected. Processing...", "loading");

      await stopCamera();

      sendQRToServer(qrText);
    }


    /*
     * ==========================================================
     * SEND QR TO APPS SCRIPT
     *
     * JSONP is used so the GitHub page can communicate
     * with Google Apps Script.
     * ==========================================================
     */

    function sendQRToServer(qrText) {

      showMessage("Checking vehicle record...", "loading");

      const callbackName =
        "qrCallback_" +
        Date.now() +
        "_" +
        Math.floor(Math.random() * 100000);


      window[callbackName] = function(response) {

        try {

          handleServerResponse(response);

        } finally {

          delete window[callbackName];

          const script =
            document.getElementById(callbackName);

          if (script) {
            script.remove();
          }

        }

      };


      const script = document.createElement("script");

      script.id = callbackName;

      const url =
        APPS_SCRIPT_URL +
        "?action=scan" +
        "&qr=" +
        encodeURIComponent(qrText) +
        "&callback=" +
        encodeURIComponent(callbackName) +
        "&_=" +
        Date.now();


      script.src = url;

      script.onerror = function() {

        console.error("Apps Script request failed.");

        showMessage(
          "Unable to connect to the monitoring server.",
          "error"
        );

        scanProcessing = false;
      };


      document.body.appendChild(script);


      /*
       * Timeout protection
       */

      setTimeout(function() {

        if (window[callbackName]) {

          delete window[callbackName];

          const oldScript =
            document.getElementById(callbackName);

          if (oldScript) {
            oldScript.remove();
          }

          showMessage(
            "Server timeout. Please try again.",
            "error"
          );

          scanProcessing = false;
        }

      }, 15000);
    }


    /*
     * ==========================================================
     * HANDLE SERVER RESPONSE
     * ==========================================================
     */

    function handleServerResponse(response) {

      console.log("Server response:", response);

      if (!response) {

        showMessage(
          "No response received from server.",
          "error"
        );

        scanProcessing = false;

        return;
      }


      if (response.success !== true) {

        showMessage(
          response.message ||
          "QR code was not recognized.",
          "error"
        );

        scanProcessing = false;

        return;
      }


      displayResult(response);

      scanProcessing = false;
    }


    /*
     * ==========================================================
     * DISPLAY RESULT
     * ==========================================================
     */

    function displayResult(data) {

      document.getElementById("scanner-card").style.display =
        "none";

      document.getElementById("result-card").style.display =
        "block";


      const statusBox =
        document.getElementById("status-box");


      const status =
        String(data.status || "").toUpperCase();


      statusBox.className = "status";


      if (status === "IN") {

        statusBox.classList.add("in");

        statusBox.textContent = "✓ IN";

      } else if (status === "OUT") {

        statusBox.classList.add("out");

        statusBox.textContent = "✓ OUT";

      } else {

        statusBox.textContent =
          data.status || "UNKNOWN";

      }


      /*
       * Visitor details
       */

      setText("office",
        data.office ||
        data.officeAgencyAssignment ||
        ""
      );

      setText("rank",
        data.rank ||
        data.position ||
        ""
      );

      setText("firstName",
        data.firstName ||
        ""
      );

      setText("middleInitial",
        data.middleInitial ||
        data.mi ||
        ""
      );

      setText("lastName",
        data.lastName ||
        ""
      );

      setText("contact",
        data.contact ||
        data.contactNumber ||
        ""
      );

      setText("vehicle",
        data.vehicle ||
        data.vehicleModel ||
        ""
      );

      setText("vehicleColor",
        data.vehicleColor ||
        data.color ||
        ""
      );

      setText("plate",
        data.plate ||
        data.plateNumber ||
        ""
      );

      setText("dateTime",
        data.dateTime ||
        ""
      );

      setText("timeIn",
        data.timeIn ||
        ""
      );

      setText("timeOut",
        data.timeOut ||
        ""
      );

      setText("purpose",
        data.purpose ||
        data.purposeOfVisit ||
        ""
      );


      showMessage(
        status === "IN"
          ? "Vehicle successfully marked IN."
          : "Vehicle successfully marked OUT.",
        "success"
      );
    }


    /*
     * ==========================================================
     * SET TEXT SAFELY
     * ==========================================================
     */

    function setText(id, value) {

      const element =
        document.getElementById(id);

      if (!element) {
        return;
      }

      element.textContent =
        value === null ||
        value === undefined ||
        value === ""
          ? "-"
          : value;
    }


    /*
     * ==========================================================
     * UPLOAD QR IMAGE
     * ==========================================================
     */

    document
      .getElementById("qr-input-file")
      .addEventListener("change", async function(event) {

        const file = event.target.files[0];

        if (!file) {
          return;
        }

        if (scanProcessing) {
          return;
        }

        scanProcessing = true;

        showMessage(
          "Reading QR image...",
          "loading"
        );


        try {

          /*
           * If a camera scanner exists and is active,
           * stop it first.
           */

          if (html5QrCode && scannerRunning) {
            await stopCamera();
          }


          /*
           * Create scanner if needed.
           */

          if (!html5QrCode) {
            html5QrCode =
              new Html5Qrcode("reader");
          }


          const decodedText =
            await html5QrCode.scanFile(
              file,
              true
            );


          console.log(
            "Uploaded QR:",
            decodedText
          );


          processScannedQR(decodedText);

        } catch (error) {

          console.error(error);

          showMessage(
            "Could not read the QR image. Please use a clear QR image.",
            "error"
          );

          scanProcessing = false;

        } finally {

          /*
           * Allows the same image to be selected again.
           */

          event.target.value = "";

        }

      });


    /*
     * ==========================================================
     * SCAN AGAIN
     * ==========================================================
     */

    function scanAgain() {

      document.getElementById("result-card").style.display =
        "none";

      document.getElementById("scanner-card").style.display =
        "block";


      document.getElementById("status-box").className =
        "status";


      scanProcessing = false;


      showMessage(
        "Ready for the next scan.",
        ""
      );
    }


    /*
     * ==========================================================
     * MESSAGE
     * ==========================================================
     */

    function showMessage(text, type) {

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.className = "";

      if (type) {
        message.classList.add(type);
      }
    }


    /*
     * ==========================================================
     * INITIAL MESSAGE
     * ==========================================================
     */

    showMessage(
      "Click START CAMERA or upload a QR image.",
      ""
    );

  </script>

</body>
</html>
