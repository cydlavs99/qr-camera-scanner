<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR Time In / Time Out</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f4f6f8;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: auto;
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,.12);
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin: 0 0 6px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 18px;
    }

    .camera-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #111;
      border-radius: 15px;
      overflow: hidden;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #canvas {
      display: none;
    }

    .scan-frame {
      position: absolute;
      width: 68%;
      height: 68%;
      left: 16%;
      top: 16%;
      border: 3px solid #00ff66;
      border-radius: 16px;
      pointer-events: none;
    }

    .scan-line {
      position: absolute;
      left: 10%;
      width: 80%;
      height: 2px;
      background: #00ff66;
      animation: scan 2s linear infinite;
      pointer-events: none;
    }

    @keyframes scan {
      0% {
        top: 10%;
      }

      50% {
        top: 90%;
      }

      100% {
        top: 10%;
      }
    }

    .camera-status {
      margin-top: 10px;
      padding: 10px;
      text-align: center;
      border-radius: 9px;
      background: #e9ecef;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    button,
    label {
      flex: 1;
      border: none;
      border-radius: 9px;
      padding: 14px 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #startCamera {
      background: #198754;
      color: white;
    }

    #stopCamera {
      background: #dc3545;
      color: white;
    }

    #switchCamera {
      width: 100%;
      margin-top: 10px;
      background: #6f42c1;
      color: white;
    }

    #backToScanner {
      width: 100%;
      margin-top: 10px;
      background: #343a40;
      color: white;
    }

    .divider {
      text-align: center;
      color: #777;
      margin: 18px 0;
      font-weight: bold;
    }

    .upload-section {
      border-top: 1px solid #ddd;
      padding-top: 18px;
    }

    label {
      display: block;
      background: #0d6efd;
      color: white;
    }

    #qrFile {
      display: none;
    }

    #preview {
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      display: none;
      margin-top: 15px;
      border-radius: 10px;
      background: #eee;
    }

    #status {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      font-size: 21px;
    }

    .processing {
      background: #fff3cd;
      color: #664d03;
    }

    .timein,
    .success {
      background: #d1e7dd;
      color: #0f5132;
    }

    .timeout,
    .error {
      background: #f8d7da;
      color: #842029;
    }

    .details-box {
      display: none;
      margin-top: 18px;
      padding: 18px;
      background: #f8f9fa;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    .details-title {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid #e1e1e1;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: #666;
      flex: 0 0 42%;
      font-size: 14px;
    }

    .detail-value {
      flex: 1;
      text-align: right;
      font-weight: bold;
      word-break: break-word;
    }

    .plate-value {
      font-size: 18px;
      letter-spacing: 1px;
    }

    #scanAgain {
      display: none;
      width: 100%;
      margin-top: 12px;
      background: #212529;
      color: white;
    }

    @media (max-width: 450px) {

      .buttons {
        flex-direction: column;
      }

      .detail-row {
        flex-direction: column;
        gap: 4px;
      }

      .detail-label,
      .detail-value {
        width: 100%;
        text-align: left;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>QR TIME IN / TIME OUT</h1>

  <div class="subtitle">
    Scan or upload QR Code
  </div>

  <div class="camera-box">

    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>

    <div class="scan-frame"></div>
    <div class="scan-line"></div>

  </div>

  <canvas id="canvas"></canvas>

  <div id="cameraStatus" class="camera-status">
    🔴 Camera OFF
  </div>

  <div class="buttons">

    <button
      id="startCamera"
      onclick="startCamera()">
      📷 START CAMERA
    </button>

    <button
      id="stopCamera"
      onclick="stopCamera()">
      ⛔ STOP CAMERA
    </button>

  </div>

  <button
    id="switchCamera"
    onclick="switchCamera()">
    🔄 SWITCH CAMERA
  </button>

  <button
    id="backToScanner"
    onclick="switchBackToScanner()">
    ↩️ SWITCH BACK TO SCANNER
  </button>

  <div class="divider">
    OR
  </div>

  <div class="upload-section">

    <label for="qrFile">
      📤 UPLOAD QR CODE
    </label>

    <input
      type="file"
      id="qrFile"
      accept="image/*">

    <img
      id="preview"
      alt="QR Preview">

  </div>

  <div id="detailsBox" class="details-box">

    <div class="details-title">
      PERSON / VEHICLE DETAILS
    </div>

    <div class="detail-row">
      <div class="detail-label">
        Rank / Full Name
      </div>

      <div
        id="detailName"
        class="detail-value">
        -
      </div>
    </div>

    <div class="detail-row">
      <div class="detail-label">
        Office / Unit
      </div>

      <div
        id="detailOffice"
        class="detail-value">
        -
      </div>
    </div>

    <div class="detail-row">
      <div class="detail-label">
        Vehicle / Model
      </div>

      <div
        id="detailVehicle"
        class="detail-value">
        -
      </div>
    </div>

    <div class="detail-row">
      <div class="detail-label">
        Contact Number
      </div>

      <div
        id="detailContact"
        class="detail-value">
        -
      </div>
    </div>

    <div class="detail-row">
      <div class="detail-label">
        Plate Number
      </div>

      <div
        id="detailPlate"
        class="detail-value plate-value">
        -
      </div>
    </div>

  </div>

  <div id="status"></div>

  <button
    id="scanAgain"
    onclick="resetScanner()">
    🔄 SCAN ANOTHER QR
  </button>

</div>

<script>

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbxKPOKY98yBA9Y-lZOiOa9Wzxx7a2nP6fwIE74yYKZGHjPh9QcpuB7pBcK8UQaOegON9g/exec";


/* ==========================================
   ELEMENTS
========================================== */

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d", {
    willReadFrequently: true
  });

const fileInput =
  document.getElementById("qrFile");

const preview =
  document.getElementById("preview");

const statusBox =
  document.getElementById("status");

const detailsBox =
  document.getElementById("detailsBox");

const scanAgainButton =
  document.getElementById("scanAgain");

const cameraStatus =
  document.getElementById("cameraStatus");

const switchButton =
  document.getElementById("switchCamera");

const backButton =
  document.getElementById("backToScanner");

const detailName =
  document.getElementById("detailName");

const detailOffice =
  document.getElementById("detailOffice");

const detailVehicle =
  document.getElementById("detailVehicle");

const detailContact =
  document.getElementById("detailContact");

const detailPlate =
  document.getElementById("detailPlate");


/* ==========================================
   VARIABLES
========================================== */

let stream = null;

let scanning = false;

let processing = false;

let cameras = [];

let currentCameraIndex = 0;

let lastQR = "";

let lastScanTime = 0;


/* ==========================================
   LOAD CAMERAS
========================================== */

async function loadCameras() {

  try {

    const devices =
      await navigator.mediaDevices.enumerateDevices();

    cameras =
      devices.filter(function(device) {

        return device.kind === "videoinput";

      });

    console.log(
      "Available cameras:",
      cameras
    );

    updateSwitchButton();

  }

  catch (error) {

    console.error(
      "Unable to enumerate cameras:",
      error
    );

    cameras = [];

  }

}


/* ==========================================
   START CAMERA
========================================== */

async function startCamera() {

  if (processing) {
    return;
  }

  try {

    stopCamera();

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      showStatus(
        "CAMERA NOT SUPPORTED<br>" +
        "<small>Please use HTTPS and a modern browser.</small>",
        "error"
      );

      return;
    }


    /*
     * First request permission.
     */

    const tempStream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });


    tempStream
      .getTracks()
      .forEach(function(track) {
        track.stop();
      });


    /*
     * Get all available cameras.
     */

    await loadCameras();


    if (cameras.length === 0) {

      showStatus(
        "NO CAMERA FOUND",
        "error"
      );

      return;
    }


    /*
     * Make sure index is valid.
     */

    if (
      currentCameraIndex < 0 ||
      currentCameraIndex >= cameras.length
    ) {

      currentCameraIndex = 0;

    }


    const camera =
      cameras[currentCameraIndex];


    /*
     * Open selected camera.
     */

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          deviceId: {
            exact: camera.deviceId
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }
        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    scanning = true;


    cameraStatus.innerHTML =
      "🟢 CAMERA ON";

    cameraStatus.style.background =
      "#d1e7dd";

    cameraStatus.style.color =
      "#0f5132";


    hideResult();


    updateSwitchButton();


    requestAnimationFrame(
      scanCamera
    );

  }

  catch (error) {

    console.error(
      "Camera error:",
      error
    );

    scanning = false;

    cameraStatus.innerHTML =
      "🔴 CAMERA ERROR";

    cameraStatus.style.background =
      "#f8d7da";

    cameraStatus.style.color =
      "#842029";


    showStatus(

      "CAMERA PERMISSION BLOCKED<br>" +

      "<small>" +
      "Allow camera access for this website, " +
      "then reload the page." +
      "</small>",

      "error"

    );

  }

}


/* ==========================================
   STOP CAMERA
========================================== */

function stopCamera() {

  scanning = false;


  if (stream) {

    stream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

    stream = null;

  }


  video.srcObject = null;


  cameraStatus.innerHTML =
    "🔴 Camera OFF";

  cameraStatus.style.background =
    "#e9ecef";

  cameraStatus.style.color =
    "#212529";

}


/* ==========================================
   SWITCH CAMERA
========================================== */

async function switchCamera() {

  if (processing) {
    return;
  }


  /*
   * If cameras are not loaded yet,
   * load them first.
   */

  if (!cameras || cameras.length === 0) {

    await loadCameras();

  }


  if (!cameras || cameras.length <= 1) {

    showStatus(
      "ONLY ONE CAMERA FOUND",
      "error"
    );

    return;

  }


  /*
   * Move to next camera.
   */

  currentCameraIndex++;


  if (
    currentCameraIndex >= cameras.length
  ) {

    currentCameraIndex = 0;

  }


  /*
   * Start selected camera.
   */

  await startCamera();

}


/* ==========================================
   SWITCH BACK TO SCANNER
========================================== */

async function switchBackToScanner() {

  if (processing) {
    return;
  }


  /*
   * Stop current camera.
   */

  stopCamera();


  /*
   * Clear current result.
   */

  processing = false;

  lastQR = "";

  lastScanTime = 0;


  /*
   * Clear uploaded image.
   */

  fileInput.value = "";

  preview.src = "";

  preview.style.display =
    "none";


  /*
   * Clear status.
   */

  statusBox.innerHTML =
    "";

  statusBox.className =
    "";

  statusBox.style.display =
    "none";


  /*
   * Clear details.
   */

  hideDetails();


  scanAgainButton.style.display =
    "none";


  /*
   * Return to first camera.
   */

  currentCameraIndex = 0;


  /*
   * Start scanner again.
   */

  await startCamera();

}


/* ==========================================
   UPDATE SWITCH BUTTON
========================================== */

function updateSwitchButton() {

  if (!switchButton) {
    return;
  }


  if (!cameras || cameras.length <= 1) {

    switchButton.innerHTML =
      "🔄 SWITCH CAMERA";

    switchButton.disabled = false;

    return;

  }


  switchButton.innerHTML =
    "🔄 SWITCH CAMERA (" +
    (currentCameraIndex + 1) +
    "/" +
    cameras.length +
    ")";

  switchButton.disabled = false;

}


/* ==========================================
   CAMERA SCANNER
========================================== */

function scanCamera() {

  if (
    !scanning ||
    processing
  ) {

    return;

  }


  if (
    video.readyState !==
    video.HAVE_ENOUGH_DATA
  ) {

    requestAnimationFrame(
      scanCamera
    );

    return;

  }


  if (
    video.videoWidth <= 0 ||
    video.videoHeight <= 0
  ) {

    requestAnimationFrame(
      scanCamera
    );

    return;

  }


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  const imageData =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  const code =
    jsQR(
      imageData.data,
      imageData.width,
      imageData.height
    );


  if (code) {

    handleQR(
      code.data
    );

    return;

  }


  requestAnimationFrame(
    scanCamera
  );

}


/* ==========================================
   UPLOAD QR
========================================== */

fileInput.addEventListener(
  "change",
  function(event) {

    const file =
      event.target.files[0];


    if (!file) {
      return;
    }


    stopCamera();


    processing = false;


    hideDetails();


    showStatus(
      "READING QR CODE...",
      "processing"
    );


    const reader =
      new FileReader();


    reader.onload =
      function(e) {

        preview.src =
          e.target.result;

        preview.style.display =
          "block";


        const img =
          new Image();


        img.onload =
          function() {

            scanUploadedImage(
              img
            );

          };


        img.src =
          e.target.result;

      };


    reader.readAsDataURL(
      file
    );

  }
);


/* ==========================================
   SCAN UPLOADED IMAGE
========================================== */

function scanUploadedImage(img) {

  canvas.width =
    img.naturalWidth;

  canvas.height =
    img.naturalHeight;


  ctx.drawImage(
    img,
    0,
    0,
    canvas.width,
    canvas.height
  );


  const imageData =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  const code =
    jsQR(
      imageData.data,
      imageData.width,
      imageData.height
    );


  if (!code) {

    showStatus(
      "QR CODE NOT FOUND<br>" +
      "<small>Please upload a clear QR image.</small>",
      "error"
    );


    scanAgainButton.style.display =
      "block";


    return;

  }


  handleQR(
    code.data
  );

}


/* ==========================================
   HANDLE QR
========================================== */

function handleQR(qrValue) {

  if (!qrValue) {
    return;
  }


  qrValue =
    String(qrValue).trim();


  const now =
    Date.now();


  if (
    qrValue === lastQR &&
    now - lastScanTime < 3000
  ) {

    return;

  }


  lastQR =
    qrValue;

  lastScanTime =
    now;


  processing = true;


  stopCamera();


  showStatus(
    "PROCESSING...",
    "processing"
  );


  /*
   * JSONP request to Google Apps Script.
   */

  const callbackName =
    "qrCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  window[callbackName] =
    function(result) {

      let script =
        null;


      try {

        processing = false;


        if (!result) {

          showStatus(
            "NO RESPONSE FROM SERVER.",
            "error"
          );


          scanAgainButton.style.display =
            "block";


          return;

        }


        if (result.success) {

          showDetails(
            result
          );


          if (
            result.action ===
            "TIME IN"
          ) {

            showStatus(
              "🟢 TIME IN",
              "timein"
            );

          }

          else if (
            result.action ===
            "TIME OUT"
          ) {

            showStatus(
              "🔴 TIME OUT",
              "timeout"
            );

          }

          else {

            showStatus(
              result.message ||
              "SCAN SUCCESSFUL",
              "success"
            );

          }

        }

        else {

          hideDetails();


          showStatus(
            result.message ||
            "INVALID QR CODE",
            "error"
          );

        }


        scanAgainButton.style.display =
          "block";

      }

      finally {

        delete window[callbackName];


        if (
          script &&
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }

      }

    };


  script =
    document.createElement(
      "script"
    );


  const encodedQR =
    encodeURIComponent(
      qrValue
    );


  script.src =
    GAS_URL +
    "?action=processScan" +
    "&qr=" +
    encodedQR +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      processing = false;


      delete window[
        callbackName
      ];


      showStatus(
        "CONNECTION ERROR<br>" +
        "<small>Unable to contact Google Apps Script.</small>",
        "error"
      );


      scanAgainButton.style.display =
        "block";


      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }

    };


  document.body.appendChild(
    script
  );

}


/* ==========================================
   DETAILS
========================================== */

function showDetails(result) {

  detailName.textContent =
    valueOrDash(
      result.name
    );


  detailOffice.textContent =
    valueOrDash(
      result.office
    );


  detailVehicle.textContent =
    valueOrDash(
      result.vehicle
    );


  detailContact.textContent =
    valueOrDash(
      result.contact
    );


  detailPlate.textContent =
    valueOrDash(
      result.plate
    );


  detailsBox.style.display =
    "block";

}


/* ==========================================
   VALUE OR DASH
========================================== */

function valueOrDash(value) {

  if (
    value === null ||
    value === undefined ||
    String(value).trim() === ""
  ) {

    return "-";

  }


  return String(value);

}


/* ==========================================
   HIDE DETAILS
========================================== */

function hideDetails() {

  detailsBox.style.display =
    "none";


  detailName.textContent =
    "-";


  detailOffice.textContent =
    "-";


  detailVehicle.textContent =
    "-";


  detailContact.textContent =
    "-";


  detailPlate.textContent =
    "-";

}


/* ==========================================
   STATUS
========================================== */

function showStatus(
  message,
  type
) {

  statusBox.innerHTML =
    message;


  statusBox.className =
    "";


  statusBox.classList.add(
    type
  );


  statusBox.style.display =
    "block";

}


/* ==========================================
   HIDE RESULT
========================================== */

function hideResult() {

  statusBox.style.display =
    "none";


  hideDetails();


  scanAgainButton.style.display =
    "none";

}


/* ==========================================
   RESET SCANNER
========================================== */

function resetScanner() {

  stopCamera();


  processing = false;


  lastQR = "";


  lastScanTime = 0;


  fileInput.value = "";


  preview.src = "";


  preview.style.display =
    "none";


  statusBox.innerHTML =
    "";


  statusBox.className =
    "";


  statusBox.style.display =
    "none";


  hideDetails();


  scanAgainButton.style.display =
    "none";


  /*
   * Automatically return to scanner.
   */

  currentCameraIndex = 0;


  startCamera();

}


/* ==========================================
   PAGE CLOSE
========================================== */

window.addEventListener(
  "beforeunload",
  function() {

    stopCamera();

  }
);


/* ==========================================
   INITIALIZE
========================================== */

window.addEventListener(
  "load",
  function() {

    loadCameras();

  }
);

</script>

</body>
</html>
