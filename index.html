<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CGFLEET Visitors Parking Registration</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 6px;
      text-align: center;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 14px;
    }

    .camera-status {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
      color: #4b5563;
      min-height: 20px;
    }

    .upload-area {
      border: 2px dashed #9ca3af;
      border-radius: 14px;
      padding: 25px 15px;
      text-align: center;
      cursor: pointer;
      background: #f9fafb;
      transition: 0.2s;
    }

    .upload-area:hover {
      background: #f3f4f6;
    }

    .upload-icon {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .upload-text {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .upload-subtext {
      color: #6b7280;
      font-size: 13px;
    }

    #qr-file {
      display: none;
    }

    #upload-reader {
      display: none;
      width: 100%;
      margin-top: 15px;
      border-radius: 14px;
      overflow: hidden;
    }

    .result {
      display: none;
      border-radius: 16px;
      padding: 20px;
      margin-top: 18px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
    }

    .result.show {
      display: block;
    }

    .result-title {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .status-badge {
      text-align: center;
      font-size: 27px;
      font-weight: bold;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 18px;
    }

    .time-in {
      background: #dcfce7;
      color: #166534;
    }

    .time-out {
      background: #fee2e2;
      color: #991b1b;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #6b7280;
      font-weight: bold;
    }

    .info-value {
      text-align: right;
      font-weight: bold;
      word-break: break-word;
    }

    .message {
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
      display: none;
      font-weight: bold;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .message.success {
      background: #dcfce7;
      color: #166534;
    }

    .message.info {
      background: #dbeafe;
      color: #1e40af;
    }

    .source-badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      background: #e5e7eb;
      color: #374151;
      font-size: 12px;
      font-weight: bold;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 12px;
      color: #4b5563;
      font-size: 14px;
    }

    .loading.show {
      display: block;
    }

    .dot-loader::after {
      content: "...";
      animation: dots 1.2s infinite;
    }

    @keyframes dots {
      0% { content: "."; }
      33% { content: ".."; }
      66% { content: "..."; }
      100% { content: "."; }
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .card {
        padding: 16px;
        border-radius: 14px;
      }

      h1 {
        font-size: 21px;
      }

      .status-badge {
        font-size: 23px;
      }

      .info-row {
        flex-direction: column;
        gap: 4px;
      }

      .info-value {
        text-align: left;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">
    <h1>CGFLEET</h1>
    <div class="subtitle">
      Visitors Parking Registration & Monitoring
    </div>

    <div class="section-title">
      📷 Camera QR Scanner
    </div>

    <div id="reader"></div>

    <div id="camera-status" class="camera-status">
      Starting camera...
    </div>

    <div id="loading" class="loading">
      Processing QR <span class="dot-loader"></span>
    </div>
  </div>


  <div class="card">

    <div class="section-title">
      🖼️ Upload QR Image
    </div>

    <label for="qr-file" class="upload-area">
      <div class="upload-icon">🖼️</div>

      <div class="upload-text">
        Click here to upload QR image
      </div>

      <div class="upload-subtext">
        Select an image containing the visitor QR code
      </div>
    </label>

    <input
      type="file"
      id="qr-file"
      accept="image/*"
    >

    <div id="upload-reader"></div>

  </div>


  <div id="message" class="message"></div>


  <div id="result" class="result">

    <div class="result-title">
      ATTENDANCE RESULT
    </div>

    <div id="status-badge" class="status-badge"></div>

    <div class="info-row">
      <div class="info-label">Plate Number</div>
      <div id="plate-number" class="info-value">-</div>
    </div>

    <div class="info-row">
      <div class="info-label">Visitor Name</div>
      <div id="visitor-name" class="info-value">-</div>
    </div>

    <div class="info-row">
      <div class="info-label">Company</div>
      <div id="company" class="info-value">-</div>
    </div>

    <div class="info-row">
      <div class="info-label">Contact</div>
      <div id="contact" class="info-value">-</div>
    </div>

    <div class="info-row">
      <div class="info-label">Time In</div>
      <div id="time-in" class="info-value">-</div>
    </div>

    <div class="info-row">
      <div class="info-label">Time Out</div>
      <div id="time-out" class="info-value">-</div>
    </div>

    <div class="info-row">
      <div class="info-label">Date</div>
      <div id="scan-date" class="info-value">-</div>
    </div>

    <div class="info-row">
      <div class="info-label">Scan Source</div>
      <div class="info-value">
        <span id="scan-source" class="source-badge">-</span>
      </div>
    </div>

  </div>

</div>


<script>

/* ============================================================
   GOOGLE APPS SCRIPT WEB APP
   ============================================================ */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbygUbFIwIo5p3g0AyJwr1YgWjsubkpg1Zp-ev8hkNx038YSJT2wxP7garS2e4B3lb0v/exec";


/* ============================================================
   GLOBAL VARIABLES
   ============================================================ */

let cameraScanner = null;
let uploadScanner = null;

let cameraRunning = false;
let uploadRunning = false;

let cameraLocked = false;
let uploadLocked = false;

let stableQR = null;
let stableSince = 0;

let resultTimer = null;
let requestTimer = null;

let requestInProgress = false;

const STABLE_TIME = 1000;
const RESULT_DISPLAY_TIME = 7000;
const SERVER_TIMEOUT = 15000;


/* ============================================================
   ELEMENTS
   ============================================================ */

const readerElement =
  document.getElementById("reader");

const uploadReaderElement =
  document.getElementById("upload-reader");

const cameraStatus =
  document.getElementById("camera-status");

const loading =
  document.getElementById("loading");

const message =
  document.getElementById("message");

const result =
  document.getElementById("result");

const statusBadge =
  document.getElementById("status-badge");


/* ============================================================
   INITIALIZE
   ============================================================ */

document.addEventListener("DOMContentLoaded", function () {

  startCameraScanner();

  document
    .getElementById("qr-file")
    .addEventListener("change", handleUpload);

});


/* ============================================================
   CAMERA SCANNER
   ============================================================ */

async function startCameraScanner() {

  try {

    if (cameraRunning) {
      return;
    }

    if (!cameraScanner) {
      cameraScanner = new Html5Qrcode("reader");
    }

    cameraStatus.textContent =
      "Starting camera...";

    await cameraScanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: function (viewfinderWidth, viewfinderHeight) {

          const size =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            ) * 0.70;

          return {
            width: size,
            height: size
          };

        },

        aspectRatio: 1.0

      },

      onCameraDetect,

      onCameraScanError

    );

    cameraRunning = true;

    cameraStatus.textContent =
      "Point the camera at a QR code";

  }

  catch (error) {

    console.error(
      "Camera start error:",
      error
    );

    cameraStatus.textContent =
      "Camera could not start. Please allow camera permission.";

    showMessage(
      "Camera could not start. Please check camera permission.",
      "error"
    );

  }

}


/* ============================================================
   CAMERA DETECTION
   ============================================================ */

function onCameraDetect(decodedText) {

  if (!decodedText) {
    return;
  }

  if (cameraLocked) {
    return;
  }

  decodedText =
    String(decodedText).trim();

  if (!decodedText) {
    return;
  }


  const now = Date.now();


  if (stableQR !== decodedText) {

    stableQR = decodedText;
    stableSince = now;

    cameraStatus.textContent =
      "QR detected — hold steady...";

    return;
  }


  const stableFor =
    now - stableSince;


  if (stableFor >= STABLE_TIME) {

    cameraLocked = true;

    stableQR = null;
    stableSince = 0;

    cameraStatus.textContent =
      "QR captured — processing...";

    processQR(
      decodedText,
      "CAMERA SCANNER"
    );

  }

}


function onCameraScanError(errorMessage) {
  /*
    Ignore normal QR scanning errors.
    html5-qrcode calls this continuously
    while no QR is detected.
  */
}


/* ============================================================
   PROCESS QR
   ============================================================ */

function processQR(qrText, source) {

  if (requestInProgress) {
    return;
  }

  qrText =
    String(qrText || "").trim();

  if (!qrText) {

    unlockCamera();

    showMessage(
      "Invalid QR code.",
      "error"
    );

    return;
  }


  requestInProgress = true;

  loading.classList.add("show");

  clearMessage();

  sendQRToServer(
    qrText,
    source
  );

}


/* ============================================================
   JSONP SERVER REQUEST
   ============================================================ */

function sendQRToServer(qrText, source) {

  const callbackName =
    "cgfleetCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement("script");


  let finished = false;


  function cleanup() {

    if (finished) {
      return;
    }

    finished = true;

    if (requestTimer) {

      clearTimeout(
        requestTimer
      );

      requestTimer = null;

    }

    try {

      delete window[callbackName];

    }

    catch (e) {

      window[callbackName] =
        undefined;

    }

    if (script.parentNode) {

      script.parentNode.removeChild(
        script
      );

    }

  }


  window[callbackName] =
    function (response) {

      cleanup();

      requestInProgress =
        false;

      loading.classList.remove(
        "show"
      );

      if (
        response &&
        response.success
      ) {

        displayResult(
          response,
          source
        );

      }

      else {

        const msg =
          response &&
          response.message
            ? response.message
            : "QR processing failed.";

        showMessage(
          msg,
          "error"
        );

        unlockCamera();

      }

    };


  script.onerror =
    function () {

      cleanup();

      requestInProgress =
        false;

      loading.classList.remove(
        "show"
      );

      showMessage(
        "Could not connect to the Google Apps Script server.",
        "error"
      );

      unlockCamera();

    };


  const url =
    APPS_SCRIPT_URL +
    "?action=scan" +
    "&qr=" +
    encodeURIComponent(qrText) +
    "&source=" +
    encodeURIComponent(source) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&_=" +
    Date.now();


  script.src = url;


  document.body.appendChild(
    script
  );


  requestTimer =
    setTimeout(
      function () {

        if (finished) {
          return;
        }

        cleanup();

        requestInProgress =
          false;

        loading.classList.remove(
          "show"
        );

        showMessage(
          "Server request timeout. Please try again.",
          "error"
        );

        unlockCamera();

      },
      SERVER_TIMEOUT
    );

}


/* ============================================================
   DISPLAY RESULT
   ============================================================ */

function displayResult(data, source) {

  clearMessage();

  result.classList.add(
    "show"
  );


  const status =
    String(
      data.status ||
      data.attendanceStatus ||
      data.action ||
      ""
    ).toUpperCase();


  if (
    status.includes("TIME OUT") ||
    status === "OUT" ||
    status.includes("OUT")
  ) {

    statusBadge.textContent =
      "TIME OUT";

    statusBadge.className =
      "status-badge time-out";

  }

  else {

    statusBadge.textContent =
      "TIME IN";

    statusBadge.className =
      "status-badge time-in";

  }


  setText(
    "plate-number",
    getValue(
      data,
      [
        "plateNumber",
        "plate",
        "Plate Number",
        "qr"
      ]
    )
  );


  setText(
    "visitor-name",
    getValue(
      data,
      [
        "visitorName",
        "name",
        "Visitor Name"
      ]
    )
  );


  setText(
    "company",
    getValue(
      data,
      [
        "company",
        "Company",
        "companyName"
      ]
    )
  );


  setText(
    "contact",
    getValue(
      data,
      [
        "contact",
        "Contact",
        "contactNumber",
        "phone"
      ]
    )
  );


  setText(
    "time-in",
    getValue(
      data,
      [
        "timeIn",
        "Time In"
      ]
    )
  );


  setText(
    "time-out",
    getValue(
      data,
      [
        "timeOut",
        "Time Out"
      ]
    )
  );


  setText(
    "scan-date",
    getValue(
      data,
      [
        "date",
        "scanDate",
        "Date"
      ]
    )
  );


  let serverSource =
    getValue(
      data,
      [
        "source",
        "scanSource",
        "Scan Source"
      ]
    );


  if (!serverSource) {
    serverSource = source;
  }


  setText(
    "scan-source",
    serverSource
  );


  if (resultTimer) {

    clearTimeout(
      resultTimer
    );

  }


  resultTimer =
    setTimeout(
      function () {

        result.classList.remove(
          "show"
        );

        clearResultFields();

        unlockCamera();

      },
      RESULT_DISPLAY_TIME
    );

}


/* ============================================================
   UPLOAD QR IMAGE
   ============================================================ */

async function handleUpload(event) {

  const file =
    event.target.files &&
    event.target.files[0];


  if (!file) {
    return;
  }


  if (uploadLocked) {

    event.target.value = "";

    return;
  }


  uploadLocked = true;

  clearMessage();

  showMessage(
    "Reading QR image...",
    "info"
  );


  try {

    if (!uploadScanner) {

      uploadScanner =
        new Html5Qrcode(
          "upload-reader"
        );

    }


    uploadReaderElement.style.display =
      "block";


    const qrText =
      await uploadScanner.scanFile(
        file,
        false
      );


    if (!qrText) {

      throw new Error(
        "No QR code found."
      );

    }


    uploadReaderElement.style.display =
      "none";


    processUploadQR(
      qrText
    );

  }

  catch (error) {

    console.error(
      "Upload QR error:",
      error
    );


    uploadReaderElement.style.display =
      "none";


    uploadLocked = false;


    showMessage(
      "Could not read a QR code from this image.",
      "error"
    );

  }


  event.target.value = "";

}


/* ============================================================
   PROCESS UPLOADED QR
   ============================================================ */

function processUploadQR(qrText) {

  if (requestInProgress) {

    uploadLocked = false;

    return;

  }


  processQR(
    qrText,
    "QR IMAGE UPLOAD"
  );

}


/* ============================================================
   UNLOCK SCANNERS
   ============================================================ */

function unlockCamera() {

  cameraLocked = false;

  stableQR = null;

  stableSince = 0;


  if (cameraRunning) {

    cameraStatus.textContent =
      "Point the camera at a QR code";

  }


  uploadLocked = false;

}


/* ============================================================
   MESSAGE
   ============================================================ */

function showMessage(text, type) {

  message.textContent =
    text || "";

  message.className =
    "message show " +
    (type || "info");

}


function clearMessage() {

  message.textContent =
    "";

  message.className =
    "message";

}


/* ============================================================
   RESULT HELPERS
   ============================================================ */

function setText(id, value) {

  const element =
    document.getElementById(id);

  if (!element) {
    return;
  }

  element.textContent =
    value !== undefined &&
    value !== null &&
    String(value).trim() !== ""
      ? value
      : "-";

}


function getValue(obj, keys) {

  if (!obj) {
    return "";
  }


  for (
    let i = 0;
    i < keys.length;
    i++
  ) {

    const key =
      keys[i];


    if (
      obj[key] !== undefined &&
      obj[key] !== null &&
      String(obj[key]).trim() !== ""
    ) {

      return obj[key];

    }

  }


  return "";

}


function clearResultFields() {

  setText(
    "plate-number",
    "-"
  );

  setText(
    "visitor-name",
    "-"
  );

  setText(
    "company",
    "-"
  );

  setText(
    "contact",
    "-"
  );

  setText(
    "time-in",
    "-"
  );

  setText(
    "time-out",
    "-"
  );

  setText(
    "scan-date",
    "-"
  );

  setText(
    "scan-source",
    "-"
  );

}


/* ============================================================
   SAFETY
   ============================================================ */

window.addEventListener(
  "beforeunload",
  function () {

    try {

      if (
        cameraScanner &&
        cameraRunning
      ) {

        cameraScanner.stop();

      }

    }

    catch (e) {}

  }
);

</script>

</body>
</html>
