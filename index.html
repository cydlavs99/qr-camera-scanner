<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>CGFLEET Visitor</title>

  <!-- CAMERA QR -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- IMAGE QR -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 18px 10px;
    }

    .app {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border: 1px solid #dfe3e8;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .header {
      text-align: center;
      padding: 16px 12px 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
    }

    .header p {
      margin: 4px 0 0;
      font-size: 12px;
      color: #6b7280;
    }

    .content {
      padding: 12px;
    }

    .system-status {
      padding: 9px 10px;
      border-radius: 8px;
      background: #eefbf2;
      color: #16723b;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .system-status.error {
      background: #fff1f2;
      color: #b42318;
    }

    .camera-box {
      width: 100%;
      border: 1px solid #d9dde3;
      border-radius: 10px;
      overflow: hidden;
      background: #111827;
    }

    #reader {
      width: 100%;
      min-height: 260px;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      border-radius: 8px;
    }

    #reader__scan_region {
      min-height: 250px !important;
    }

    #reader__dashboard {
      display: none !important;
    }

    .camera-buttons {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .start-btn {
      flex: 1;
      background: #166534;
      color: #fff;
    }

    .stop-btn {
      flex: 1;
      background: #991b1b;
      color: #fff;
    }

    .upload-label {
      display: block;
      text-align: center;
      margin-top: 10px;
      padding: 11px 12px;
      border-radius: 8px;
      background: #1d4ed8;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    #qrFile {
      display: none;
    }

    .mini-status {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .mini-box {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 9px;
      background: #f8fafc;
      font-size: 11px;
    }

    .mini-label {
      display: block;
      color: #6b7280;
      margin-bottom: 2px;
    }

    .mini-value {
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .result {
      margin-top: 12px;
      border: 1px solid #d9dde3;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
    }

    .result-head {
      padding: 10px;
      text-align: center;
      background: #f8fafc;
      border-bottom: 1px solid #e5e7eb;
      font-weight: 800;
      font-size: 12px;
    }

    .result-status {
      text-align: center;
      padding: 12px 10px;
      font-size: 24px;
      font-weight: 900;
    }

    .status-in {
      color: #15803d;
      background: #f0fdf4;
    }

    .status-out {
      color: #b91c1c;
      background: #fef2f2;
    }

    .status-processing {
      color: #1d4ed8;
      background: #eff6ff;
    }

    .status-error {
      color: #b42318;
      background: #fff1f2;
      font-size: 15px;
    }

    .details {
      padding: 10px;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 43% 57%;
      padding: 5px 0;
      border-bottom: 1px solid #f0f1f3;
      font-size: 12px;
    }

    .detail-row:last-child {
      border-bottom: 0;
    }

    .detail-label {
      color: #6b7280;
      font-weight: 700;
    }

    .detail-value {
      font-weight: 800;
      overflow-wrap: anywhere;
      text-align: right;
    }

    .footer {
      text-align: center;
      padding: 10px;
      border-top: 1px solid #e5e7eb;
      color: #7b8490;
      font-size: 10px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 360px) {

      body {
        padding: 8px 6px;
      }

      .app {
        border-radius: 10px;
      }

      .detail-row {
        grid-template-columns: 46% 54%;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <h1>CGFLEET Visitor</h1>
      <p>QR TIME IN / TIME OUT</p>
    </div>

    <div class="content">

      <div id="systemStatus" class="system-status">
        🟢 Connecting to monitoring system...
      </div>

      <div class="camera-box">
        <div id="reader"></div>
      </div>

      <div class="camera-buttons">
        <button
          id="startBtn"
          class="start-btn"
          onclick="startCamera()"
        >
          START SCANNER
        </button>

        <button
          id="stopBtn"
          class="stop-btn"
          onclick="stopCamera()"
          disabled
        >
          STOP
        </button>
      </div>

      <label
        id="uploadLabel"
        class="upload-label"
        for="qrFile"
      >
        UPLOAD QR IMAGE
      </label>

      <input
        id="qrFile"
        type="file"
        accept="image/*"
        capture="environment"
      >

      <div class="mini-status">

        <div class="mini-box">
          <span class="mini-label">Camera</span>
          <span id="cameraStatus" class="mini-value">
            OFF
          </span>
        </div>

        <div class="mini-box">
          <span class="mini-label">Upload</span>
          <span id="uploadStatus" class="mini-value">
            READY
          </span>
        </div>

      </div>

      <div class="result">

        <div class="result-head">
          ATTENDANCE RESULT
        </div>

        <div
          id="resultStatus"
          class="result-status"
        >
          READY
        </div>

        <div
          id="resultDetails"
          class="details hidden"
        ></div>

      </div>

    </div>

    <div class="footer">
      CGFLEET QR Monitoring System
    </div>

  </div>


<script>
/* =====================================================
   CONFIG
   ===================================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxOxcG0QSfIDTTJRtDr3XQ5vIqNmCKKtndm6eddfaWDCQysSJI5eT3zUATOjZKlGHsJ/exec";


/* =====================================================
   GLOBALS
   ===================================================== */

let html5QrCode = null;

let cameraRunning = false;

let transactionBusy = false;

let lastQRCode = "";

let lastQRTime = 0;

let callbackCounter = 0;

let visitors = {};

let clearTimer = null;


/* =====================================================
   DOM
   ===================================================== */

const systemStatus =
  document.getElementById("systemStatus");

const cameraStatus =
  document.getElementById("cameraStatus");

const uploadStatus =
  document.getElementById("uploadStatus");

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const uploadLabel =
  document.getElementById("uploadLabel");

const qrFile =
  document.getElementById("qrFile");

const resultStatus =
  document.getElementById("resultStatus");

const resultDetails =
  document.getElementById("resultDetails");


/* =====================================================
   UTILITIES
   ===================================================== */

function normalizeQR(value) {

  return String(value || "")
    .trim()
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, "");
}


function escapeHtml(value) {

  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function setSystemStatus(text, error = false) {

  systemStatus.textContent = text;

  systemStatus.classList.toggle(
    "error",
    !!error
  );
}


function unlockTransaction() {

  transactionBusy = false;

  qrFile.disabled = false;

  uploadLabel.style.pointerEvents = "auto";

  uploadStatus.textContent = "READY";
}


function lockTransaction() {

  transactionBusy = true;

  qrFile.disabled = true;

  uploadLabel.style.pointerEvents = "none";

  uploadStatus.textContent = "BUSY";
}


function showReady() {

  resultStatus.className =
    "result-status";

  resultStatus.textContent =
    "READY";

  resultDetails.classList.add("hidden");

  resultDetails.innerHTML = "";
}


function scheduleClear() {

  clearTimeout(clearTimer);

  clearTimer = setTimeout(function() {

    if (!transactionBusy) {
      showReady();
    }

  }, 7000);
}


/* =====================================================
   JSONP API
   ===================================================== */

function apiRequest(action, params = {}) {

  return new Promise(function(resolve, reject) {

    callbackCounter++;

    const callbackName =
      "cgfleetCallback_" +
      Date.now() +
      "_" +
      callbackCounter;

    const script =
      document.createElement("script");

    let finished = false;

    const query = new URLSearchParams();

    query.set("action", action);

    query.set(
      "callback",
      callbackName
    );

    query.set(
      "_",
      String(Date.now())
    );

    Object.keys(params).forEach(function(key) {

      query.set(
        key,
        params[key] == null
          ? ""
          : String(params[key])
      );
    });

    const url =
      APPS_SCRIPT_URL +
      "?" +
      query.toString();

    function cleanup() {

      try {
        delete window[callbackName];
      } catch (ignore) {}

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }
    }

    const timeout = setTimeout(function() {

      if (finished) {
        return;
      }

      finished = true;

      cleanup();

      reject(
        new Error(
          "Could not connect to the Google Apps Script server."
        )
      );

    }, 20000);

    window[callbackName] = function(data) {

      if (finished) {
        return;
      }

      finished = true;

      clearTimeout(timeout);

      cleanup();

      resolve(data);
    };

    script.onerror = function() {

      if (finished) {
        return;
      }

      finished = true;

      clearTimeout(timeout);

      cleanup();

      reject(
        new Error(
          "Could not connect to the Google Apps Script server."
        )
      );
    };

    script.src = url;

    document.body.appendChild(script);
  });
}


/* =====================================================
   BOOTSTRAP
   ===================================================== */

async function loadBootstrap() {

  try {

    const data =
      await apiRequest("bootstrap");

    if (!data || !data.success) {

      throw new Error(
        data && data.message
          ? data.message
          : "Bootstrap failed."
      );
    }

    visitors = {};

    (data.visitors || []).forEach(function(person) {

      const key = normalizeQR(
        person.plate || person.qr
      );

      if (key) {
        visitors[key] = person;
      }
    });

    setSystemStatus(
      "🟢 Monitoring system ready"
    );

  } catch (err) {

    setSystemStatus(
      "🔴 Server connection failed",
      true
    );

    console.error(err);
  }
}


/* =====================================================
   CAMERA
   ===================================================== */

async function startCamera() {

  if (cameraRunning) {
    return;
  }

  if (transactionBusy) {
    return;
  }

  try {

    if (!html5QrCode) {

      html5QrCode =
        new Html5Qrcode("reader");
    }

    cameraStatus.textContent =
      "STARTING...";

    startBtn.disabled = true;
    stopBtn.disabled = false;

    const config = {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      aspectRatio: 1.0,

      disableFlip: false
    };

    await html5QrCode.start(
      {
        facingMode: "environment"
      },
      config,
      onCameraSuccess,
      onCameraError
    );

    cameraRunning = true;

    cameraStatus.textContent =
      "ON";

  } catch (err) {

    cameraRunning = false;

    startBtn.disabled = false;
    stopBtn.disabled = true;

    cameraStatus.textContent =
      "ERROR";

    showError(
      "Camera could not start: " +
      (err && err.message
        ? err.message
        : err)
    );
  }
}


function onCameraSuccess(decodedText) {

  if (transactionBusy) {
    return;
  }

  const qr = String(decodedText || "").trim();

  if (!qr) {
    return;
  }

  const now =
    Date.now();

  /*
   * Small duplicate protection.
   * First valid frame is accepted immediately.
   */
  if (
    qr === lastQRCode &&
    now - lastQRTime < 900
  ) {
    return;
  }

  lastQRCode = qr;
  lastQRTime = now;

  /*
   * Stop camera immediately after first valid QR.
   */
  stopCamera();

  processQR(
    qr,
    "CAMERA SCANNER"
  );
}


function onCameraError(errorMessage) {

  /*
   * html5-qrcode continuously reports scan misses.
   * We intentionally do not show those as errors.
   */
}


/* =====================================================
   STOP CAMERA
   ===================================================== */

async function stopCamera() {

  if (!html5QrCode) {

    cameraRunning = false;

    cameraStatus.textContent =
      "OFF";

    startBtn.disabled =
      transactionBusy;

    stopBtn.disabled = true;

    return;
  }

  try {

    if (cameraRunning) {

      await html5QrCode.stop();

      await html5QrCode.clear();
    }

  } catch (err) {

    console.warn(
      "Camera stop:",
      err
    );
  }

  cameraRunning = false;

  cameraStatus.textContent =
    "OFF";

  startBtn.disabled =
    transactionBusy;

  stopBtn.disabled = true;
}


/* =====================================================
   UPLOAD QR
   ===================================================== */

qrFile.addEventListener(
  "change",
  async function(event) {

    if (transactionBusy) {

      qrFile.value = "";

      return;
    }

    const file =
      event.target.files &&
      event.target.files[0];

    if (!file) {
      return;
    }

    uploadStatus.textContent =
      "READING...";

    try {

      const qr =
        await decodeUploadedQR(file);

      if (!qr) {

        throw new Error(
          "QR code could not be read from the image."
        );
      }

      await processQR(
        qr,
        "QR IMAGE UPLOAD"
      );

    } catch (err) {

      uploadStatus.textContent =
        "FAILED";

      showError(
        err && err.message
          ? err.message
          : "QR image could not be read."
      );

    } finally {

      qrFile.value = "";

      if (!transactionBusy) {
        uploadStatus.textContent =
          "READY";
      }
    }
  }
);


/* =====================================================
   QR IMAGE DECODER
   ===================================================== */

async function decodeUploadedQR(file) {

  const bitmap =
    await createImageBitmap(file);

  const originalCanvas =
    document.createElement("canvas");

  const maxSize = 1600;

  const scale =
    Math.min(
      1,
      maxSize /
      Math.max(
        bitmap.width,
        bitmap.height
      )
    );

  originalCanvas.width =
    Math.round(bitmap.width * scale);

  originalCanvas.height =
    Math.round(bitmap.height * scale);

  const originalCtx =
    originalCanvas.getContext("2d", {
      willReadFrequently: true
    });

  originalCtx.drawImage(
    bitmap,
    0,
    0,
    originalCanvas.width,
    originalCanvas.height
  );

  let result =
    scanCanvasForQR(
      originalCanvas,
      originalCtx
    );

  if (result) {
    return result;
  }

  /*
   * Retry with grayscale / threshold.
   */
  const levels = [
    180,
    150,
    120
  ];

  for (const threshold of levels) {

    const canvas =
      document.createElement("canvas");

    canvas.width =
      originalCanvas.width;

    canvas.height =
      originalCanvas.height;

    const ctx =
      canvas.getContext("2d", {
        willReadFrequently: true
      });

    ctx.drawImage(
      originalCanvas,
      0,
      0
    );

    const imageData =
      ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );

    const data =
      imageData.data;

    for (
      let i = 0;
      i < data.length;
      i += 4
    ) {

      const gray =
        (
          data[i] * 0.299 +
          data[i + 1] * 0.587 +
          data[i + 2] * 0.114
        );

      const value =
        gray > threshold
          ? 255
          : 0;

      data[i] =
        value;

      data[i + 1] =
        value;

      data[i + 2] =
        value;
    }

    ctx.putImageData(
      imageData,
      0,
      0
    );

    result =
      scanCanvasForQR(
        canvas,
        ctx
      );

    if (result) {
      return result;
    }
  }

  return null;
}


function scanCanvasForQR(
  canvas,
  ctx
) {

  const imageData =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

  const code =
    jsQR(
      imageData.data,
      imageData.width,
      imageData.height,
      {
        inversionAttempts:
          "attemptBoth"
      }
    );

  return code
    ? String(code.data || "").trim()
    : null;
}


/* =====================================================
   PROCESS QR
   ===================================================== */

async function processQR(
  qr,
  source
) {

  if (transactionBusy) {
    return;
  }

  qr = String(qr || "").trim();

  if (!qr) {
    return;
  }

  lockTransaction();

  /*
   * Show local details immediately when bootstrap has it.
   */
  const localPerson =
    visitors[
      normalizeQR(qr)
    ];

  if (localPerson) {

    showLocalProcessing(
      localPerson,
      source
    );

  } else {

    showProcessing(
      "PROCESSING..."
    );
  }

  try {

    const result =
      await apiRequest(
        "scan",
        {
          qr: qr,
          source: source
        }
      );

    if (!result) {

      throw new Error(
        "Empty server response."
      );
    }

    if (!result.success) {

      throw new Error(
        result.message ||
        "Attendance save failed."
      );
    }

    /*
     * Server is the final authority.
     */
    showSuccess(
      result
    );

    /*
     * Update local state.
     */
    visitors[
      normalizeQR(
        result.plate || qr
      )
    ] = result;

    unlockTransaction();

    scheduleClear();

  } catch (err) {

    showError(
      err && err.message
        ? err.message
        : "Save failed — ready to retry"
    );

    unlockTransaction();
  }
}


/* =====================================================
   RESULT UI
   ===================================================== */

function showProcessing(text) {

  resultStatus.className =
    "result-status status-processing";

  resultStatus.textContent =
    text;

  resultDetails.classList.add(
    "hidden"
  );

  resultDetails.innerHTML =
    "";
}


function showLocalProcessing(
  person,
  source
) {

  resultStatus.className =
    "result-status status-processing";

  resultStatus.textContent =
    "PROCESSING...";

  resultDetails.innerHTML =
    buildDetailsHtml(
      person,
      {
        source: source
      }
    );

  resultDetails.classList.remove(
    "hidden"
  );
}


function showSuccess(result) {

  const status =
    String(
      result.status ||
      result.attendanceStatus ||
      ""
    ).toUpperCase();

  if (status === "IN") {

    resultStatus.className =
      "result-status status-in";

    resultStatus.textContent =
      "TIME IN";

  } else {

    resultStatus.className =
      "result-status status-out";

    resultStatus.textContent =
      "TIME OUT";
  }

  resultDetails.innerHTML =
    buildDetailsHtml(
      result,
      result
    );

  resultDetails.classList.remove(
    "hidden"
  );
}


function showError(message) {

  clearTimeout(clearTimer);

  resultStatus.className =
    "result-status status-error";

  resultStatus.textContent =
    message || "Save failed";

  resultDetails.classList.add(
    "hidden"
  );

  resultDetails.innerHTML =
    "";
}


function buildDetailsHtml(
  person,
  transaction
) {

  const p =
    person || {};

  const t =
    transaction || {};

  return [

    detailRow(
      "RANK / Position",
      p.rank
    ),

    detailRow(
      "First Name",
      p.firstName
    ),

    detailRow(
      "MI",
      p.mi
    ),

    detailRow(
      "Last Name",
      p.lastName
    ),

    detailRow(
      "Office / Agency / Assignment",
      p.office
    ),

    detailRow(
      "Contact Number",
      p.contact
    ),

    detailRow(
      "Vehicle / Model",
      p.vehicle
    ),

    detailRow(
      "Plate Number",
      p.plate
    ),

    detailRow(
      "Color of Vehicle",
      p.vehicleColor
    ),

    detailRow(
      "Time In",
      t.timeIn
    ),

    detailRow(
      "Time Out",
      t.timeOut
    ),

    detailRow(
      "Date",
      t.date
    ),

    detailRow(
      "Scan Source",
      t.source
    )

  ].join("");
}


function detailRow(
  label,
  value
) {

  return `
    <div class="detail-row">
      <div class="detail-label">
        ${escapeHtml(label)}
      </div>

      <div class="detail-value">
        ${escapeHtml(value || "")}
      </div>
    </div>
  `;
}


/* =====================================================
   PAGE INITIALIZATION
   ===================================================== */

window.addEventListener(
  "load",
  function() {

    loadBootstrap();
  }
);

</script>

</body>
</html>
