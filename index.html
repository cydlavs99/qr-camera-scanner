<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>CGFLEET Visitor</title>

  <!-- CAMERA QR SCANNER -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- QR IMAGE DECODER -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 14px 8px;
    }

    .app {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border: 1px solid #dfe3e8;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    }

    .header {
      text-align: center;
      padding: 15px 10px 11px;
      border-bottom: 1px solid #e5e7eb;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
    }

    .header p {
      margin: 4px 0 0;
      font-size: 12px;
      color: #6b7280;
    }

    .content {
      padding: 11px;
    }

    .system-status {
      padding: 9px 10px;
      border-radius: 8px;
      background: #ecfdf3;
      color: #166534;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .system-status.error {
      background: #fff1f2;
      color: #b42318;
    }

    .camera-box {
      width: 100%;
      border: 1px solid #d9dde3;
      border-radius: 10px;
      overflow: hidden;
      background: #111827;
    }

    #reader {
      width: 100%;
      min-height: 255px;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      display: block;
    }

    #reader__scan_region {
      min-height: 250px !important;
    }

    #reader__dashboard {
      display: none !important;
    }

    .camera-buttons {
      display: flex;
      gap: 8px;
      margin-top: 9px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .start-btn {
      flex: 1;
      background: #166534;
      color: #ffffff;
    }

    .stop-btn {
      flex: 1;
      background: #991b1b;
      color: #ffffff;
    }

    .upload-label {
      display: block;
      text-align: center;
      margin-top: 9px;
      padding: 11px 12px;
      border-radius: 8px;
      background: #1d4ed8;
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    #qrFile {
      display: none;
    }

    .mini-status {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 9px;
    }

    .mini-box {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 9px;
      background: #f8fafc;
      font-size: 11px;
    }

    .mini-label {
      display: block;
      color: #6b7280;
      margin-bottom: 2px;
    }

    .mini-value {
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .result {
      margin-top: 11px;
      border: 1px solid #d9dde3;
      border-radius: 10px;
      overflow: hidden;
      background: #ffffff;
    }

    .result-head {
      padding: 9px;
      text-align: center;
      background: #f8fafc;
      border-bottom: 1px solid #e5e7eb;
      font-weight: 800;
      font-size: 12px;
    }

    .result-status {
      text-align: center;
      padding: 12px 10px;
      font-size: 23px;
      font-weight: 900;
    }

    .status-ready {
      color: #475569;
      background: #f8fafc;
    }

    .status-processing {
      color: #1d4ed8;
      background: #eff6ff;
    }

    .status-in {
      color: #15803d;
      background: #f0fdf4;
    }

    .status-out {
      color: #b91c1c;
      background: #fef2f2;
    }

    .status-error {
      color: #b42318;
      background: #fff1f2;
      font-size: 14px;
    }

    .details {
      padding: 10px;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 44% 56%;
      padding: 5px 0;
      border-bottom: 1px solid #f0f1f3;
      font-size: 12px;
    }

    .detail-row:last-child {
      border-bottom: 0;
    }

    .detail-label {
      color: #6b7280;
      font-weight: 700;
    }

    .detail-value {
      font-weight: 800;
      overflow-wrap: anywhere;
      text-align: right;
    }

    .footer {
      text-align: center;
      padding: 9px;
      border-top: 1px solid #e5e7eb;
      color: #7b8490;
      font-size: 10px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <h1>CGFLEET Visitor</h1>
      <p>QR TIME IN / TIME OUT</p>
    </div>

    <div class="content">

      <div
        id="systemStatus"
        class="system-status"
      >
        🟡 Connecting to monitoring system...
      </div>

      <div class="camera-box">
        <div id="reader"></div>
      </div>

      <div class="camera-buttons">

        <button
          id="startBtn"
          class="start-btn"
          onclick="startCamera()"
        >
          START SCANNER
        </button>

        <button
          id="stopBtn"
          class="stop-btn"
          onclick="stopCamera()"
          disabled
        >
          STOP
        </button>

      </div>

      <label
        id="uploadLabel"
        class="upload-label"
        for="qrFile"
      >
        UPLOAD QR IMAGE
      </label>

      <input
        id="qrFile"
        type="file"
        accept="image/*"
        capture="environment"
      >

      <div class="mini-status">

        <div class="mini-box">
          <span class="mini-label">Camera</span>
          <span
            id="cameraStatus"
            class="mini-value"
          >
            OFF
          </span>
        </div>

        <div class="mini-box">
          <span class="mini-label">Upload</span>
          <span
            id="uploadStatus"
            class="mini-value"
          >
            READY
          </span>
        </div>

      </div>

      <div class="result">

        <div class="result-head">
          ATTENDANCE RESULT
        </div>

        <div
          id="resultStatus"
          class="result-status status-ready"
        >
          READY
        </div>

        <div
          id="resultDetails"
          class="details hidden"
        ></div>

      </div>

    </div>

    <div class="footer">
      CGFLEET QR Monitoring System
    </div>

  </div>


<script>

/* =========================================================
   APPS SCRIPT WEB APP
   ========================================================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxm7IlWRtrEAwFCW7hzzD8X4ZY5GNKKPE0tsTlbPd7WPo-GugZnAao1mdUoO-0Prtwo/exec";


/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let html5QrCode = null;

let cameraRunning = false;

let transactionBusy = false;

let lastQRCode = "";

let lastQRTime = 0;

let callbackCounter = 0;

let visitors = {};

let clearTimer = null;


/* =========================================================
   DOM
   ========================================================= */

const systemStatus =
  document.getElementById(
    "systemStatus"
  );

const cameraStatus =
  document.getElementById(
    "cameraStatus"
  );

const uploadStatus =
  document.getElementById(
    "uploadStatus"
  );

const startBtn =
  document.getElementById(
    "startBtn"
  );

const stopBtn =
  document.getElementById(
    "stopBtn"
  );

const uploadLabel =
  document.getElementById(
    "uploadLabel"
  );

const qrFile =
  document.getElementById(
    "qrFile"
  );

const resultStatus =
  document.getElementById(
    "resultStatus"
  );

const resultDetails =
  document.getElementById(
    "resultDetails"
  );


/* =========================================================
   BASIC HELPERS
   ========================================================= */

function normalizeQR(value) {

  return String(
    value || ""
  )
    .trim()
    .toUpperCase()
    .replace(
      /[^A-Z0-9]/g,
      ""
    );
}


function escapeHtml(value) {

  return String(
    value == null
      ? ""
      : value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* =========================================================
   SYSTEM STATUS
   ========================================================= */

function setSystemStatus(
  text,
  error
) {

  systemStatus.textContent =
    text;

  systemStatus.classList.toggle(
    "error",
    !!error
  );
}


/* =========================================================
   TRANSACTION LOCK
   ========================================================= */

function lockTransaction() {

  transactionBusy =
    true;

  qrFile.disabled =
    true;

  uploadLabel.style.pointerEvents =
    "none";

  startBtn.disabled =
    true;

  uploadStatus.textContent =
    "BUSY";
}


function unlockTransaction() {

  transactionBusy =
    false;

  qrFile.disabled =
    false;

  uploadLabel.style.pointerEvents =
    "auto";

  startBtn.disabled =
    false;

  uploadStatus.textContent =
    "READY";
}


/* =========================================================
   CLEAR RESULT
   ========================================================= */

function scheduleClear() {

  clearTimeout(
    clearTimer
  );

  clearTimer =
    setTimeout(
      function() {

        if (
          !transactionBusy
        ) {

          showReady();
        }

      },
      7000
    );
}


function showReady() {

  resultStatus.className =
    "result-status status-ready";

  resultStatus.textContent =
    "READY";

  resultDetails.classList.add(
    "hidden"
  );

  resultDetails.innerHTML =
    "";
}


/* =========================================================
   JSONP REQUEST
   ========================================================= */

function apiRequest(
  action,
  params
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      callbackCounter++;

      const callbackName =
        "cgfleet_" +
        Date.now() +
        "_" +
        callbackCounter;

      const script =
        document.createElement(
          "script"
        );

      let completed =
        false;

      const query =
        new URLSearchParams();


      query.set(
        "action",
        action
      );

      query.set(
        "callback",
        callbackName
      );

      query.set(
        "_",
        String(
          Date.now()
        )
      );


      params =
        params || {};


      Object.keys(
        params
      ).forEach(
        function(key) {

          query.set(
            key,
            params[key] == null
              ? ""
              : String(
                  params[key]
                )
          );

        }
      );


      const url =
        APPS_SCRIPT_URL +
        "?" +
        query.toString();


      let timer =
        null;


      function cleanup() {

        if (timer) {

          clearTimeout(
            timer
          );

          timer = null;
        }


        try {

          delete window[
            callbackName
          ];

        } catch (err) {}


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );
        }
      }


      timer =
        setTimeout(
          function() {

            if (
              completed
            ) {
              return;
            }


            completed =
              true;

            cleanup();


            reject(
              new Error(
                "Could not connect to the Google Apps Script server."
              )
            );

          },
          20000
        );


      window[
        callbackName
      ] =
        function(data) {

          if (
            completed
          ) {
            return;
          }


          completed =
            true;

          cleanup();


          resolve(
            data
          );
        };


      script.onerror =
        function() {

          if (
            completed
          ) {
            return;
          }


          completed =
            true;

          cleanup();


          reject(
            new Error(
              "Could not connect to the Google Apps Script server."
            )
          );
        };


      script.src =
        url;


      document.body.appendChild(
        script
      );

    }
  );
}


/* =========================================================
   BOOTSTRAP
   ========================================================= */

async function loadBootstrap() {

  try {

    const data =
      await apiRequest(
        "bootstrap"
      );


    if (
      !data ||
      !data.success
    ) {

      throw new Error(
        data &&
        data.message
          ? data.message
          : "Bootstrap failed."
      );
    }


    visitors = {};


    const list =
      data.visitors ||
      [];


    list.forEach(
      function(person) {

        const key =
          normalizeQR(
            person.plate ||
            person.qr
          );


        if (key) {

          visitors[key] =
            person;
        }
      }
    );


    setSystemStatus(
      "🟢 Monitoring system ready"
    );

  } catch (err) {

    console.error(
      "Bootstrap error:",
      err
    );


    setSystemStatus(
      "🔴 Server connection failed",
      true
    );
  }
}


/* =========================================================
   CAMERA START
   ========================================================= */

async function startCamera() {

  if (
    cameraRunning ||
    transactionBusy
  ) {
    return;
  }


  try {

    if (!html5QrCode) {

      html5QrCode =
        new Html5Qrcode(
          "reader"
        );
    }


    cameraStatus.textContent =
      "STARTING...";


    startBtn.disabled =
      true;

    stopBtn.disabled =
      false;


    const config = {

      fps:
        10,

      qrbox: {
        width:
          250,
        height:
          250
      },

      aspectRatio:
        1.0,

      disableFlip:
        false
    };


    await html5QrCode.start(

      {
        facingMode:
          "environment"
      },

      config,

      onCameraSuccess,

      onCameraError

    );


    cameraRunning =
      true;


    cameraStatus.textContent =
      "ON";


  } catch (err) {

    console.error(
      "Camera error:",
      err
    );


    cameraRunning =
      false;


    startBtn.disabled =
      false;

    stopBtn.disabled =
      true;


    cameraStatus.textContent =
      "ERROR";


    showError(
      "Camera could not start."
    );
  }
}


/* =========================================================
   CAMERA SUCCESS
   ========================================================= */

function onCameraSuccess(
  decodedText
) {

  if (
    transactionBusy
  ) {
    return;
  }


  const qr =
    String(
      decodedText || ""
    ).trim();


  if (!qr) {
    return;
  }


  const now =
    Date.now();


  /*
   * Duplicate protection.
   *
   * The FIRST valid QR is accepted immediately.
   */

  if (
    qr === lastQRCode &&
    (
      now -
      lastQRTime
    ) <
      900
  ) {

    return;
  }


  lastQRCode =
    qr;

  lastQRTime =
    now;


  /*
   * Stop camera immediately.
   */

  stopCamera();


  processQR(
    qr,
    "CAMERA SCANNER"
  );
}


function onCameraError(
  errorMessage
) {

  /*
   * Normal scan misses are ignored.
   */
}


/* =========================================================
   CAMERA STOP
   ========================================================= */

async function stopCamera() {

  if (
    !html5QrCode
  ) {

    cameraRunning =
      false;

    cameraStatus.textContent =
      "OFF";

    stopBtn.disabled =
      true;

    startBtn.disabled =
      transactionBusy;

    return;
  }


  try {

    if (
      cameraRunning
    ) {

      await html5QrCode.stop();

      await html5QrCode.clear();
    }

  } catch (err) {

    console.warn(
      "Camera stop:",
      err
    );
  }


  cameraRunning =
    false;


  cameraStatus.textContent =
    "OFF";


  stopBtn.disabled =
    true;


  startBtn.disabled =
    transactionBusy;
}


/* =========================================================
   FILE UPLOAD
   ========================================================= */

qrFile.addEventListener(
  "change",
  async function(event) {

    if (
      transactionBusy
    ) {

      qrFile.value =
        "";

      return;
    }


    const file =
      event.target.files &&
      event.target.files[0];


    if (!file) {
      return;
    }


    uploadStatus.textContent =
      "READING...";


    try {

      const qr =
        await decodeUploadedQR(
          file
        );


      if (!qr) {

        throw new Error(
          "QR code could not be read from the image."
        );
      }


      await processQR(
        qr,
        "QR IMAGE UPLOAD"
      );


    } catch (err) {

      console.error(
        "Upload QR error:",
        err
      );


      showError(
        err &&
        err.message
          ? err.message
          : "QR image could not be read."
      );


    } finally {

      qrFile.value =
        "";


      if (
        !transactionBusy
      ) {

        uploadStatus.textContent =
          "READY";
      }
    }
  }
);


/* =========================================================
   IMAGE QR DECODER
   ========================================================= */

async function decodeUploadedQR(
  file
) {

  const bitmap =
    await createImageBitmap(
      file
    );


  const maxSize =
    1800;


  const scale =
    Math.min(
      1,
      maxSize /
      Math.max(
        bitmap.width,
        bitmap.height
      )
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    Math.round(
      bitmap.width *
      scale
    );


  canvas.height =
    Math.round(
      bitmap.height *
      scale
    );


  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:
          true
      }
    );


  ctx.drawImage(
    bitmap,
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
   * First attempt:
   * Original image.
   */

  let result =
    scanCanvasForQR(
      canvas,
      ctx
    );


  if (result) {
    return result;
  }


  /*
   * Additional threshold attempts.
   */

  const thresholds =
    [
      200,
      180,
      160,
      140,
      120
    ];


  for (
    const threshold of
    thresholds
  ) {

    const processed =
      document.createElement(
        "canvas"
      );


    processed.width =
      canvas.width;

    processed.height =
      canvas.height;


    const pctx =
      processed.getContext(
        "2d",
        {
          willReadFrequently:
            true
        }
      );


    pctx.drawImage(
      canvas,
      0,
      0
    );


    const imageData =
      pctx.getImageData(
        0,
        0,
        processed.width,
        processed.height
      );


    const data =
      imageData.data;


    for (
      let i = 0;
      i < data.length;
      i += 4
    ) {

      const gray =
        (
          data[i] *
          0.299
        ) +
        (
          data[i + 1] *
          0.587
        ) +
        (
          data[i + 2] *
          0.114
        );


      const value =
        gray >= threshold
          ? 255
          : 0;


      data[i] =
        value;

      data[i + 1] =
        value;

      data[i + 2] =
        value;
    }


    pctx.putImageData(
      imageData,
      0,
      0
    );


    result =
      scanCanvasForQR(
        processed,
        pctx
      );


    if (result) {

      return result;
    }
  }


  return null;
}


function scanCanvasForQR(
  canvas,
  ctx
) {

  const imageData =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  const qr =
    jsQR(
      imageData.data,
      imageData.width,
      imageData.height,
      {
        inversionAttempts:
          "attemptBoth"
      }
    );


  if (
    qr &&
    qr.data
  ) {

    return String(
      qr.data
    ).trim();
  }


  return null;
}


/* =========================================================
   PROCESS QR
   ========================================================= */

async function processQR(
  qr,
  source
) {

  if (
    transactionBusy
  ) {
    return;
  }


  const cleanQR =
    String(
      qr || ""
    ).trim();


  if (!cleanQR) {
    return;
  }


  lockTransaction();


  /*
   * Show local person immediately if loaded.
   */

  const person =
    visitors[
      normalizeQR(
        cleanQR
      )
    ];


  if (person) {

    showLocalProcessing(
      person,
      source
    );

  } else {

    showProcessing(
      "PROCESSING..."
    );
  }


  try {

    const result =
      await apiRequest(
        "scan",
        {
          qr:
            cleanQR,

          source:
            source
        }
      );


    if (!result) {

      throw new Error(
        "Empty response from attendance server."
      );
    }


    if (!result.success) {

      throw new Error(
        result.message ||
        "Attendance save failed."
      );
    }


    /*
     * SERVER-CONFIRMED RESULT.
     */

    showSuccess(
      result
    );


    /*
     * Update local visitor state.
     */

    const key =
      normalizeQR(
        result.plate ||
        cleanQR
      );


    if (key) {

      visitors[key] =
        result;
    }


    /*
     * Unlock only after successful server save.
     */

    unlockTransaction();


    scheduleClear();


  } catch (err) {

    console.error(
      "Scan error:",
      err
    );


    showError(
      err &&
      err.message
        ? err.message
        : "Save failed — ready to retry"
    );


    unlockTransaction();
  }
}


/* =========================================================
   RESULT: PROCESSING
   ========================================================= */

function showProcessing(
  text
) {

  clearTimeout(
    clearTimer
  );


  resultStatus.className =
    "result-status status-processing";


  resultStatus.textContent =
    text;


  resultDetails.classList.add(
    "hidden"
  );


  resultDetails.innerHTML =
    "";
}


/* =========================================================
   RESULT: LOCAL PERSON
   ========================================================= */

function showLocalProcessing(
  person,
  source
) {

  clearTimeout(
    clearTimer
  );


  resultStatus.className =
    "result-status status-processing";


  resultStatus.textContent =
    "PROCESSING...";


  resultDetails.innerHTML =
    buildDetailsHtml(
      person,
      {
        source:
          source,

        timeIn:
          "",

        timeOut:
          "",

        date:
          ""
      }
    );


  resultDetails.classList.remove(
    "hidden"
  );
}


/* =========================================================
   RESULT: SUCCESS
   ========================================================= */

function showSuccess(
  result
) {

  clearTimeout(
    clearTimer
  );


  const status =
    String(
      result.status ||
      result.attendanceStatus ||
      ""
    )
      .toUpperCase();


  if (
    status === "IN"
  ) {

    resultStatus.className =
      "result-status status-in";

    resultStatus.textContent =
      "TIME IN";


  } else {

    resultStatus.className =
      "result-status status-out";

    resultStatus.textContent =
      "TIME OUT";
  }


  resultDetails.innerHTML =
    buildDetailsHtml(
      result,
      result
    );


  resultDetails.classList.remove(
    "hidden"
  );
}


/* =========================================================
   RESULT: ERROR
   ========================================================= */

function showError(
  message
) {

  clearTimeout(
    clearTimer
  );


  resultStatus.className =
    "result-status status-error";


  resultStatus.textContent =
    message ||
    "Save failed — ready to retry";


  resultDetails.classList.add(
    "hidden"
  );


  resultDetails.innerHTML =
    "";
}


/* =========================================================
   DETAILS
   ========================================================= */

function buildDetailsHtml(
  person,
  transaction
) {

  const p =
    person ||
    {};

  const t =
    transaction ||
    {};


  return [

    detailRow(
      "RANK / Position",
      p.rank
    ),

    detailRow(
      "First Name",
      p.firstName
    ),

    detailRow(
      "MI",
      p.mi
    ),

    detailRow(
      "Last Name",
      p.lastName
    ),

    detailRow(
      "Office / Agency / Assignment",
      p.office
    ),

    detailRow(
      "Contact Number",
      p.contact
    ),

    detailRow(
      "Vehicle / Model",
      p.vehicle
    ),

    detailRow(
      "Plate Number",
      p.plate
    ),

    detailRow(
      "Color of Vehicle",
      p.vehicleColor
    ),

    detailRow(
      "Time In",
      t.timeIn
    ),

    detailRow(
      "Time Out",
      t.timeOut
    ),

    detailRow(
      "Date",
      t.date
    ),

    detailRow(
      "Scan Source",
      t.source
    )

  ].join("");
}


function detailRow(
  label,
  value
) {

  return (
    '<div class="detail-row">' +

      '<div class="detail-label">' +
        escapeHtml(
          label
        ) +
      '</div>' +

      '<div class="detail-value">' +
        escapeHtml(
          value || ""
        ) +
      '</div>' +

    '</div>'
  );
}


/* =========================================================
   INITIALIZATION
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    loadBootstrap();

  }
);

</script>
