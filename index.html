<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>CGFLEET QR Monitoring</title>

  <!-- QR SCANNER LIBRARY -->
  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f1f3f4;
      color: #202124;
    }


    body {
      padding: 12px;
    }


    .container {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }


    .header {
      background: #4285f4;
      color: white;
      text-align: center;
      border-radius: 14px;
      padding: 18px 12px;
      margin-bottom: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }


    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: bold;
    }


    .header p {
      margin: 6px 0 0;
      font-size: 14px;
    }


    .scanner-card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.10);
    }


    #reader {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 12px;
    }


    #reader video {
      width: 100% !important;
      height: auto !important;
      border-radius: 12px;
    }


    #reader img {
      max-width: 100%;
    }


    .button-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }


    button,
    .upload-button {
      min-height: 50px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
    }


    .start-button {
      background: #4285f4;
      color: white;
    }


    .stop-button {
      background: #d93025;
      color: white;
    }


    .upload-button {
      background: #188038;
      color: white;
      grid-column: 1 / 3;
    }


    #qr-file {
      display: none;
    }


    #message {
      display: none;
      margin-top: 14px;
      padding: 13px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      font-size: 15px;
    }


    .message-info {
      display: block !important;
      background: #fff3cd;
      color: #664d03;
    }


    .message-success {
      display: block !important;
      background: #d1e7dd;
      color: #0f5132;
    }


    .message-error {
      display: block !important;
      background: #f8d7da;
      color: #842029;
    }


    #result {
      display: none;
      margin-top: 14px;
      background: white;
      border-radius: 14px;
      padding: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.10);
    }


    .success-title {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 14px;
    }


    #attendance-status {
      width: 100%;
      padding: 18px 10px;
      border-radius: 12px;
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 15px;
    }


    .status-in {
      background: #00ff00;
      color: #000000;
    }


    .status-out {
      background: #ff0000;
      color: #ffffff;
    }


    .status-success {
      background: #4285f4;
      color: #ffffff;
    }


    .details-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }


    .details-table tr {
      border-bottom: 1px solid #e0e0e0;
    }


    .details-table td {
      padding: 11px 6px;
      vertical-align: top;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }


    .details-table td:first-child {
      width: 42%;
      font-weight: bold;
    }


    .details-table td:last-child {
      width: 58%;
    }


    .scan-again-button {
      width: 100%;
      margin-top: 15px;
      background: #4285f4;
      color: white;
    }


    .footer {
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      padding: 15px 5px;
    }


    @media screen and (max-width: 480px) {

      body {
        padding: 8px;
      }


      .header h1 {
        font-size: 20px;
      }


      .header p {
        font-size: 13px;
      }


      .button-container {
        grid-template-columns: 1fr;
      }


      .upload-button {
        grid-column: auto;
      }


      button,
      .upload-button {
        width: 100%;
      }


      #attendance-status {
        font-size: 29px;
      }


      .details-table td {
        font-size: 14px;
      }

    }

  </style>

</head>


<body>


  <div class="container">


    <div class="header">

      <h1>
        CGFLEET QR MONITORING
      </h1>

      <p>
        Vehicle Time In / Time Out Monitoring
      </p>

    </div>


    <div class="scanner-card">

      <div id="reader"></div>


      <div class="button-container">


        <button
          type="button"
          class="start-button"
          onclick="startCamera()"
        >
          📷 START CAMERA
        </button>


        <button
          type="button"
          class="stop-button"
          onclick="stopCamera()"
        >
          ⛔ STOP CAMERA
        </button>


        <label
          for="qr-file"
          class="upload-button"
        >
          🖼️ UPLOAD QR IMAGE
        </label>


        <input
          id="qr-file"
          type="file"
          accept="image/*"
          onchange="scanImage(event)"
        >


      </div>


      <div id="message"></div>

    </div>


    <div id="result">

      <div class="success-title">
        ✅ SCAN SUCCESSFUL
      </div>


      <div
        id="attendance-status"
        class="status-success"
      >
        SUCCESS
      </div>


      <table class="details-table">

        <tbody id="details-body"></tbody>

      </table>


      <button
        type="button"
        class="scan-again-button"
        onclick="scanAgain()"
      >
        📷 SCAN AGAIN
      </button>

    </div>


    <div class="footer">
      CGFLEET Parking and Access Monitoring System
    </div>


  </div>


  <script>


    /******************************************************
     * GOOGLE APPS SCRIPT WEB APP URL
     *
     * THIS IS THE BACKEND.
     ******************************************************/

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbxaLMBNWEhTmn5TPojbtslyUhRDPR2CNGgJaKmJDuAd-KkiIkbYtzBeZ7glzFH80eFu/exec";


    /******************************************************
     * VARIABLES
     ******************************************************/

    let qrScanner = null;

    let cameraRunning = false;

    let processingScan = false;

    let lastQRCode = "";

    let jsonpCounter = 0;


    /******************************************************
     * MESSAGE
     ******************************************************/

    function showMessage(
      text,
      type
    ) {

      const message =
        document.getElementById(
          "message"
        );


      message.textContent =
        text || "";


      message.className =
        "";


      if (!text) {

        message.style.display =
          "none";

        return;

      }


      if (type === "success") {

        message.className =
          "message-success";

      }

      else if (type === "error") {

        message.className =
          "message-error";

      }

      else {

        message.className =
          "message-info";

      }


      message.style.display =
        "block";

    }


    /******************************************************
     * START CAMERA
     ******************************************************/

    function startCamera() {

      if (cameraRunning) {

        showMessage(
          "Camera is already running.",
          "info"
        );

        return;

      }


      processingScan =
        false;

      lastQRCode =
        "";


      showMessage(
        "Starting camera. Please allow camera permission.",
        "info"
      );


      if (!qrScanner) {

        qrScanner =
          new Html5Qrcode(
            "reader"
          );

      }


      const config = {

        fps: 10,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.floor(
              Math.min(
                width,
                height
              ) * 0.70
            );


          return {
            width: size,
            height: size
          };

        },

        aspectRatio: 1.0

      };


      qrScanner
        .start(

          {
            facingMode: "environment"
          },

          config,

          function(
            decodedText
          ) {

            qrDetected(
              decodedText
            );

          },

          function(errorMessage) {

            /*
             * Scanner keeps checking for QR.
             * Errors during searching are ignored.
             */

          }

        )

        .then(function() {

          cameraRunning =
            true;


          showMessage(
            "Camera ready. Point the camera at the QR Code.",
            "success"
          );

        })

        .catch(function(error) {

          console.error(
            "Camera error:",
            error
          );


          cameraRunning =
            false;


          showMessage(
            "Camera could not be opened. Allow camera permission or use UPLOAD QR IMAGE.",
            "error"
          );

        });

    }


    /******************************************************
     * STOP CAMERA
     ******************************************************/

    function stopCamera() {

      if (
        !qrScanner ||
        !cameraRunning
      ) {

        return Promise.resolve();

      }


      return qrScanner
        .stop()

        .then(function() {

          cameraRunning =
            false;

        })

        .catch(function(error) {

          console.error(
            "Stop camera error:",
            error
          );


          cameraRunning =
            false;

        });

    }


    /******************************************************
     * QR DETECTED
     ******************************************************/

    function qrDetected(
      decodedText
    ) {

      if (processingScan) {

        return;

      }


      if (
        !decodedText ||
        String(decodedText).trim() === ""
      ) {

        return;

      }


      if (
        String(decodedText) ===
        lastQRCode
      ) {

        return;

      }


      lastQRCode =
        String(decodedText);


      processingScan =
        true;


      showMessage(
        "QR detected. Processing...",
        "info"
      );


      stopCamera()
        .then(function() {

          sendQRToServer(
            decodedText
          );

        })

        .catch(function() {

          sendQRToServer(
            decodedText
          );

        });

    }


    /******************************************************
     * SEND QR TO GOOGLE APPS SCRIPT
     *
     * IMPORTANT:
     *
     * This is GitHub code.
     *
     * Therefore:
     * DO NOT use google.script.run.
     *
     * We use JSONP instead.
     ******************************************************/

    function sendQRToServer(
      qrText
    ) {

      showMessage(
        "Checking Registered QR Code...",
        "info"
      );


      const callbackName =
        "cgfleetQRCallback_" +
        Date.now() +
        "_" +
        (++jsonpCounter);


      const script =
        document.createElement(
          "script"
        );


      let finished =
        false;


      const cleanup =
        function() {

          try {

            delete window[
              callbackName
            ];

          } catch (error) {

            window[
              callbackName
            ] =
              undefined;

          }


          if (
            script.parentNode
          ) {

            script.parentNode.removeChild(
              script
            );

          }

        };


      const timeout =
        setTimeout(
          function() {

            if (finished) {

              return;

            }


            finished =
              true;


            cleanup();


            processingScan =
              false;


            showMessage(
              "Server connection timed out. Please try again.",
              "error"
            );

          },
          30000
        );


      window[
        callbackName
      ] =
        function(response) {

          if (finished) {

            return;

          }


          finished =
            true;


          clearTimeout(
            timeout
          );


          cleanup();


          processingScan =
            false;


          handleServerResponse(
            response
          );

        };


      script.onerror =
        function() {

          if (finished) {

            return;

          }


          finished =
            true;


          clearTimeout(
            timeout
          );


          cleanup();


          processingScan =
            false;


          showMessage(
            "Unable to connect to the CGFLEET server.",
            "error"
          );

        };


      const url =
        APPS_SCRIPT_URL +
        "?action=scan" +
        "&qr=" +
        encodeURIComponent(
          String(qrText)
        ) +
        "&callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&t=" +
        Date.now();


      script.src =
        url;


      document
        .head
        .appendChild(
          script
        );

    }


    /******************************************************
     * UPLOAD QR IMAGE
     ******************************************************/

    function scanImage(
      event
    ) {

      const file =
        event.target.files &&
        event.target.files[0];


      if (!file) {

        return;

      }


      processingScan =
        true;


      lastQRCode =
        "";


      showMessage(
        "Reading QR image...",
        "info"
      );


      if (!qrScanner) {

        qrScanner =
          new Html5Qrcode(
            "reader"
          );

      }


      qrScanner
        .scanFile(
          file,
          true
        )

        .then(function(decodedText) {

          showMessage(
            "QR detected. Processing...",
            "info"
          );


          sendQRToServer(
            decodedText
          );

        })

        .catch(function(error) {

          console.error(
            "Image QR error:",
            error
          );


          processingScan =
            false;


          showMessage(
            "No valid QR Code was found in the selected image.",
            "error"
          );

        });


      /*
       * Allows selecting the same image again.
       */

      event.target.value =
        "";

    }


    /******************************************************
     * HANDLE SERVER RESPONSE
     ******************************************************/

    function handleServerResponse(
      response
    ) {

      if (!response) {

        showMessage(
          "No response was received from the server.",
          "error"
        );

        return;

      }


      if (
        response.success === false
      ) {

        showMessage(
          response.message ||
          "QR Code was not found.",
          "error"
        );

        return;

      }


      showMessage(
        response.message ||
        "Scan successful.",
        "success"
      );


      displayResult(
        response
      );

    }


    /******************************************************
     * DISPLAY RESULT
     ******************************************************/

    function displayResult(
      response
    ) {

      const result =
        document.getElementById(
          "result"
        );


      const statusElement =
        document.getElementById(
          "attendance-status"
        );


      const detailsBody =
        document.getElementById(
          "details-body"
        );


      result.style.display =
        "block";


      detailsBody.innerHTML =
        "";


      const status =
        String(
          response.status ||
          "SUCCESS"
        )
        .trim()
        .toUpperCase();


      statusElement.className =
        "";


      if (
        status === "IN"
      ) {

        statusElement.className =
          "status-in";


        statusElement.textContent =
          "✓ IN";

      }

      else if (
        status === "OUT"
      ) {

        statusElement.className =
          "status-out";


        statusElement.textContent =
          "✓ OUT";

      }

      else {

        statusElement.className =
          "status-success";


        statusElement.textContent =
          status;

      }


      let details =
        response.details ||
        response.data ||
        response.record ||
        {};


      if (
        Array.isArray(details)
      ) {

        const converted =
          {};


        details.forEach(
          function(item) {

            if (
              item &&
              item.header !== undefined
            ) {

              converted[
                item.header
              ] =
                item.value;

            }

          }
        );


        details =
          converted;

      }


      const preferredOrder = [

        "Office/Agency/Assignment",

        "Serial Number",

        "RANK/Position",

        "Rank/Position",

        "First Name",

        "M.I.",

        "Last Name",

        "Contact Number",

        "Vehicle/Model",

        "Color of Vehicle",

        "Plate Number",

        "Purpose of Visit",

        "Status",

        "Date/Time",

        "Time In",

        "Time Out"

      ];


      const displayed =
        {};


      preferredOrder.forEach(
        function(header) {

          const actualKey =
            findMatchingKey(
              details,
              header
            );


          if (
            actualKey !== null
          ) {

            const value =
              details[
                actualKey
              ];


            if (
              value !== "" &&
              value !== null &&
              value !== undefined
            ) {

              addDetailRow(
                detailsBody,
                actualKey,
                value
              );


              displayed[
                normalizeText(
                  actualKey
                )
              ] =
                true;

            }

          }

        }
      );


      Object.keys(details)
        .forEach(
          function(key) {

            const normalized =
              normalizeText(
                key
              );


            if (
              displayed[
                normalized
              ]
            ) {

              return;

            }


            const value =
              details[key];


            if (
              value === "" ||
              value === null ||
              value === undefined
            ) {

              return;

            }


            addDetailRow(
              detailsBody,
              key,
              value
            );

          }
        );

    }


    /******************************************************
     * ADD DETAIL ROW
     ******************************************************/

    function addDetailRow(
      tbody,
      header,
      value
    ) {

      const row =
        document.createElement(
          "tr"
        );


      const headerCell =
        document.createElement(
          "td"
        );


      const valueCell =
        document.createElement(
          "td"
        );


      headerCell.textContent =
        header;


      valueCell.textContent =
        formatValue(
          value
        );


      row.appendChild(
        headerCell
      );


      row.appendChild(
        valueCell
      );


      tbody.appendChild(
        row
      );

    }


    /******************************************************
     * FIND MATCHING OBJECT KEY
     ******************************************************/

    function findMatchingKey(
      object,
      requestedHeader
    ) {

      const wanted =
        normalizeText(
          requestedHeader
        );


      const keys =
        Object.keys(
          object
        );


      for (
        let i = 0;
        i < keys.length;
        i++
      ) {

        if (
          normalizeText(
            keys[i]
          ) === wanted
        ) {

          return keys[i];

        }

      }


      return null;

    }


    /******************************************************
     * NORMALIZE TEXT
     ******************************************************/

    function normalizeText(
      value
    ) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }


      return String(value)
        .trim()
        .replace(/\s+/g, " ")
        .toLowerCase();

    }


    /******************************************************
     * FORMAT VALUE
     ******************************************************/

    function formatValue(
      value
    ) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }


      return String(
        value
      );

    }


    /******************************************************
     * SCAN AGAIN
     ******************************************************/

    function scanAgain() {

      document.getElementById(
        "result"
      ).style.display =
        "none";


      document.getElementById(
        "details-body"
      ).innerHTML =
        "";


      document.getElementById(
        "attendance-status"
      ).textContent =
        "SUCCESS";


      document.getElementById(
        "attendance-status"
      ).className =
        "status-success";


      processingScan =
        false;


      lastQRCode =
        "";


      showMessage(
        "Ready for next scan.",
        "success"
      );


      startCamera();

    }


    /******************************************************
     * PAGE LOAD
     ******************************************************/

    window.addEventListener(
      "load",
      function() {

        showMessage(
          "Press START CAMERA or UPLOAD QR IMAGE.",
          "info"
        );

      }
    );


  </script>


</body>

</html>
